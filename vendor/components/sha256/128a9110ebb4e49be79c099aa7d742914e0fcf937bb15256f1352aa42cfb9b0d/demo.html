<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-flow の見本</title>
<!-- 組み方：node kit/build.mjs components/flow/demo.html -o components/flow/out/demo.html -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>ベイズ決定の流れ</h2>
  <div class="body">
    <m-flow style="height:420px">
      <script type="application/json">{
        "nodes": [
          {"id": "w",  "label": "観測 *w*",            "x": 0,   "y": 40,  "w": 220, "h": 80, "step": 1},
          {"id": "p",  "tex": "p(y\\mid w)",          "x": 330, "y": 40,  "w": 240, "h": 80, "step": 1},
          {"id": "L",  "label": "損失 *L*(*y*, *a*)\n（与えられる）", "x": 330, "y": 260, "w": 240, "h": 100, "step": 2, "tone": "muted"},
          {"id": "r",  "tex": "r(a\\mid w)",          "x": 680, "y": 150, "w": 220, "h": 80, "step": 3},
          {"id": "a",  "label": "決定 *a*^*",          "x": 1000, "y": 150, "w": 184, "h": 80, "step": 4, "tone": "emph"}
        ],
        "edges": [
          {"from": "w", "to": "p", "step": 1, "label": "予測"},
          {"from": "p", "to": "r", "step": 3},
          {"from": "L", "to": "r", "step": 3, "dash": true},
          {"from": "r", "to": "a", "step": 4, "label": "最小化", "tone": "emph"}
        ]
      }</script>
    </m-flow>
  </div>
  <div class="concl"><span>→ 予測と損失から期待損失 <i>r</i> を作り，それを最小にする <i>a</i> を選ぶ</span></div>
</section>

<section class="slide">
  <h2>お金とサービスの流れ（架空）</h2>
  <div class="body">
    <m-flow style="height:420px">
      <script type="application/json">{
        "nodes": [
          {"id": "co",  "label": "自社",         "x": 470, "y": 20,  "w": 240, "h": 80, "step": 1, "tone": "emph"},
          {"id": "cu",  "label": "顧客の会社",   "x": 60,  "y": 300, "w": 260, "h": 80, "step": 1},
          {"id": "us",  "label": "社員（使う人）", "x": 860, "y": 300, "w": 300, "h": 80, "step": 2},
          {"id": "cl",  "label": "クラウド",     "x": 950, "y": 20,  "w": 220, "h": 80, "step": 3, "tone": "muted"}
        ],
        "edges": [
          {"from": "co", "to": "cu", "kind": "service", "label": "使う権利", "shift": 14, "step": 1},
          {"from": "cu", "to": "co", "kind": "money", "amount": "月 3 万円", "shift": 14, "step": 2, "pulse": [2, 3]},
          {"from": "cu", "to": "us", "kind": "service", "label": "配る", "step": 2},
          {"from": "us", "to": "co", "kind": "data", "label": "使い方の記録", "step": 3, "pulse": true},
          {"from": "co", "to": "cl", "kind": "money", "amount": "売上の 15 %", "step": 3}
        ]
      }</script>
    </m-flow>
  </div>
  <div class="concl"><span>→ 会社が払い，社員が使い，記録が戻る</span></div>
</section>

<section class="slide">
  <h2>1 から <i>n</i> までの和を求める手順（判断とくり返し）</h2>
  <div class="body">
    <m-flow aria-label="1 から n までの和を求める流れ図" style="height:420px">
      <script type="application/json">{
        "nodes": [
          {"id": "init", "label": "*S* ← 0, *i* ← 1",  "x": 0,   "y": 70,  "w": 220, "h": 80, "step": 1},
          {"id": "dec",  "label": "*i* ≤ *n* ?",       "x": 290, "y": 40,  "w": 260, "h": 140, "step": 1, "shape": "diamond"},
          {"id": "add",  "label": "*S* ← *S* + *i*",   "x": 640, "y": 70,  "w": 230, "h": 80, "step": 2},
          {"id": "inc",  "label": "*i* ← *i* + 1",     "x": 950, "y": 70,  "w": 220, "h": 80, "step": 2},
          {"id": "out",  "label": "*S* を出力",        "x": 305, "y": 300, "w": 230, "h": 80, "step": 4, "tone": "emph"}
        ],
        "edges": [
          {"from": "init", "to": "dec", "step": 1},
          {"from": "dec", "to": "add", "label": "はい", "step": 2},
          {"from": "add", "to": "inc", "step": 2},
          {"from": "inc", "to": "dec", "loop": "top", "label": "くり返す", "step": 3},
          {"from": "dec", "to": "out", "label": "いいえ", "step": 4, "tone": "emph"}
        ]
      }</script>
    </m-flow>
  </div>
  <div class="concl"><span>→ <i>i</i> が <i>n</i> をこえるまで足してから，<i>S</i> を出力する</span></div>
</section>

</div>
</body>
</html>
