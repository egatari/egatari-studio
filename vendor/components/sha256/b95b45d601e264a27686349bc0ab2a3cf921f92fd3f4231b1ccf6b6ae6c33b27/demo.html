<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-tape の見本</title>
<!-- 組み方：node kit/build.mjs components/tape/demo.html -o components/tape/out/demo.html -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>□を使った式：みかんははじめに何こ？</h2>
  <div class="body">
    <m-tape style="height:360px">
      <script type="application/json">{"rows": [{"segs": [{"v": 8, "label": "食べた 8 こ"}, {"v": 15, "label": "のこり 15 こ"}]}],
        "brace": [{"row": 0, "from": 0, "to": 1, "label": "はじめ □ こ", "side": "above"}]}</script>
    </m-tape>
  </div>
  <div class="concl"><span>→ □ − 8 = 15 だから、□ = 15 + 8 = 23</span></div>
</section>

<section class="slide">
  <h2>B のテープは A のテープの何倍？（線分図）</h2>
  <div class="body">
    <m-tape kind="line" style="height:380px">
      <script type="application/json">{"rows": [
          {"label": "A のテープ", "segs": [{"v": 12, "label": "12 m"}]},
          {"label": "B のテープ", "segs": [{"v": 12}, {"v": 12}, {"v": 12}]}],
        "brace": [{"row": 1, "from": 0, "to": 2, "label": "36 m", "side": "below"}],
        "times": [{"from": 0, "to": 1, "label": "□ 倍"}]}</script>
    </m-tape>
  </div>
  <div class="concl"><span>→ B は A（12 m）の 3 つ分で 36 m。36 ÷ 12 = 3 で 3 倍</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 36px">
      <m-tape variant="fade" build="rows" style="height:400px">
        <script type="application/json">{"rows": [{"label": "弟", "segs": [{"v": 20, "label": "20 まい"}]},
          {"label": "兄", "segs": [{"v": 40, "unknown": "□", "label": "まい"}]}],
          "times": [{"from": 0, "to": 1, "label": "2 倍"}]}</script>
      </m-tape>
      <m-tape variant="grow" build="rows" style="height:400px">
        <script type="application/json">{"rows": [{"label": "弟", "segs": [{"v": 20, "label": "20 まい"}]},
          {"label": "兄", "segs": [{"v": 40, "unknown": "□", "label": "まい"}]}],
          "times": [{"from": 0, "to": 1, "label": "2 倍"}]}</script>
      </m-tape>
    </div>
  </div>
  <div class="concl"><span>→ 左はフェード（既定）、右は左から伸びる</span></div>
</section>

</div>
</body>
</html>
