# Known vulnerabilities in the packages that ship (dependencies, not devDependencies).
# Fails only for high or critical advisories in production dependencies; dev-only advisories are not looked at (--omit=dev).
# tools/audit-check.mjs runs `npm audit --omit=dev --json` and applies the same rule, except for the advisories listed in AUDIT_ALLOW
# (npm has no ignore list). Any other advisory at high or above still fails the job, and so does the list itself once it has expired.
# A new advisory can appear without any change here, so it also runs weekly. The existing test workflow is not touched.
name: audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'   # Mondays, 04:41 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
      - name: npm audit (production dependencies, high and above, with the exceptions below)
        env:
          AUDIT_LEVEL: high
          # Expiry: remove by v0.6.6, when the book tools are bundled with markdown-it 14.3.3. The job fails once package.json reaches it.
          AUDIT_ALLOW_UNTIL: 0.6.6
          # markdown-it 13.0.2, only through myst-parser 1.7.4 / myst-transforms 1.3.51 (the book reader, kit/core/article-text.mjs).
          # No released myst-parser, markdown-it-dollarmath or myst-to-html allows 14, and forcing 14.3.3 with overrides breaks them:
          # they import markdown-it/lib/common/utils.js, which 14 does not have. myst-parser runs markdown-it with html: true,
          # typographer (smartquotes) on and linkify off. The book text of an opened file is untrusted input (SECURITY.md).
          #   GHSA-r7fv-28h4-cvq7 (high)     smartquotes, unmatched closing quotes: REACHABLE. Guard: ARTICLE_LIMITS.paragraphQuotes
          #                                  (512 " and ' in one paragraph; above it the book is refused before parsing, articleUnsafeParagraph)
          #   GHSA-6v5v-wf23-fmfq (moderate) smartquotes, replaceAt: REACHABLE. Guard: ARTICLE_LIMITS.paragraphQuotes, as above
          #   GHSA-vfgh-jcmw-g37q (low)      inline HTML (<!--, <?, <!A, <![CDATA[) with html: true: REACHABLE.
          #                                  Guard: ARTICLE_LIMITS.paragraphHtmlStarts (64 "<!" and "<?" in one paragraph)
          #   GHSA-38c4-r59v-3vqw (moderate) ReDoS in linkify: not reachable (linkify is off)
          #   GHSA-253c-mchw-3w2r (moderate) linkify: true quadratic paths: not reachable (linkify is off)
          AUDIT_ALLOW: |
            markdown-it GHSA-r7fv-28h4-cvq7
            markdown-it GHSA-6v5v-wf23-fmfq
            markdown-it GHSA-vfgh-jcmw-g37q
            markdown-it GHSA-38c4-r59v-3vqw
            markdown-it GHSA-253c-mchw-3w2r
        run: node tools/audit-check.mjs
