<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-tree の見本</title>
<!-- 組み方：node kit/build.mjs components/tree/demo.html -o components/tree/out/demo.html（会社は架空） -->
<style>
.vcap{font-size:27px;color:var(--muted);text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>会社の組織（架空）</h2>
  <div class="body">
    <m-tree aria-label="架空の会社の組織図" style="height:440px">
      <script type="application/json">{
        "nodes": [
          {"id": "ceo", "label": "社長", "tone": "emph"},
          {"id": "s", "label": "営業本部", "parent": "ceo"},
          {"id": "d", "label": "開発本部", "parent": "ceo"},
          {"id": "a", "label": "管理本部", "parent": "ceo"},
          {"id": "s1", "label": "国内営業部", "parent": "s"},
          {"id": "s2", "label": "海外営業部", "parent": "s"},
          {"id": "d1", "label": "製品開発部", "parent": "d"},
          {"id": "d2", "label": "品質保証部", "parent": "d"},
          {"id": "a1", "label": "人事部", "parent": "a"},
          {"id": "a2", "label": "経理部", "parent": "a"},
          {"id": "d11", "label": "設計課", "parent": "d1"},
          {"id": "d12", "label": "試作課", "parent": "d1"},
          {"id": "d13", "label": "試験課", "parent": "d1", "note": "2026 年に新設"}
        ]
      }</script>
    </m-tree>
  </div>
  <div class="concl"><span>→ 上から 1 段ずつ：本部、部、課</span></div>
</section>

<section class="slide">
  <h2>動物の分け方（orient="right"）</h2>
  <div class="body">
    <m-tree orient="right" aria-label="動物の分類" style="height:440px">
      <script type="application/json">{
        "nodes": [
          {"id": "an", "label": "動物"},
          {"id": "v", "label": "脊椎動物", "parent": "an", "note": "背骨がある"},
          {"id": "i", "label": "無脊椎動物", "parent": "an", "note": "背骨がない", "tone": "muted"},
          {"id": "f", "label": "魚類", "parent": "v"},
          {"id": "am", "label": "両生類", "parent": "v"},
          {"id": "r", "label": "は虫類", "parent": "v"},
          {"id": "b", "label": "鳥類", "parent": "v"},
          {"id": "m", "label": "哺乳類", "parent": "v", "tone": "emph"},
          {"id": "ar", "label": "節足動物", "parent": "i", "tone": "muted"},
          {"id": "mo", "label": "軟体動物", "parent": "i", "tone": "muted"}
        ],
        "edges": [
          {"from": "r", "to": "b", "label": "近い仲間", "step": 4}
        ]
      }</script>
    </m-tree>
  </div>
  <div class="concl"><span>→ 背骨の有無で分け、脊椎動物をさらに 5 つに分ける</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px">
      <div><div class="vcap">箱、それから線（fade、既定）</div>
      <m-tree variant="fade" aria-label="植物の分類（fade）" style="height:330px">
        <script type="application/json">{"nodes": [{"id": "p", "label": "植物"}, {"id": "s", "label": "種子植物", "parent": "p"}, {"id": "f", "label": "胞子植物", "parent": "p"}, {"id": "a", "label": "被子植物", "parent": "s"}, {"id": "g", "label": "裸子植物", "parent": "s"}]}</script>
      </m-tree></div>
      <div><div class="vcap">線を引いてから箱（draw）</div>
      <m-tree variant="draw" aria-label="植物の分類（draw）" style="height:330px">
        <script type="application/json">{"nodes": [{"id": "p", "label": "植物"}, {"id": "s", "label": "種子植物", "parent": "p"}, {"id": "f", "label": "胞子植物", "parent": "p"}, {"id": "a", "label": "被子植物", "parent": "s"}, {"id": "g", "label": "裸子植物", "parent": "s"}]}</script>
      </m-tree></div>
      <div><div class="vcap">親の側から大きくなる（grow）</div>
      <m-tree variant="grow" aria-label="植物の分類（grow）" style="height:330px">
        <script type="application/json">{"nodes": [{"id": "p", "label": "植物"}, {"id": "s", "label": "種子植物", "parent": "p"}, {"id": "f", "label": "胞子植物", "parent": "p"}, {"id": "a", "label": "被子植物", "parent": "s"}, {"id": "g", "label": "裸子植物", "parent": "s"}]}</script>
      </m-tree></div>
    </div>
  </div>
  <div class="concl"><span>→ 書かなければ最初の見せ方（fade）になる</span></div>
</section>

</div>
</body>
</html>
