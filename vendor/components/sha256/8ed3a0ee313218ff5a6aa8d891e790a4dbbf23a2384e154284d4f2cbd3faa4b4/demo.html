<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-map-japan の見本</title>
<!-- 組み方：node kit/build.mjs components/map-japan/demo.html -o components/map-japan/out/demo.html
     地図データ：Natural Earth（パブリックドメイン）を加工。
     人口：総務省統計局「令和2年国勢調査 人口速報集計結果」表Ⅱ－1（2020年10月1日現在。万人未満を四捨五入）。
     北前船の寄港地は江戸時代の西廻り航路のおもな港（公知の事実） -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>日本の八地方区分</h2>
  <div class="body">
    <m-map-japan aria-label="八地方区分の地図" style="height:440px">
      <script type="application/json">{
        "regions": [
          {"group": "hokkaido", "tone": "series-1", "step": 1},
          {"group": "tohoku", "tone": "series-2", "step": 2},
          {"group": "kanto", "tone": "series-3", "step": 3},
          {"group": "chubu", "tone": "series-1", "step": 4},
          {"group": "kinki", "tone": "series-4", "step": 5},
          {"group": "chugoku", "tone": "series-2", "step": 6},
          {"group": "shikoku", "tone": "series-3", "step": 7},
          {"group": "kyushu", "tone": "series-1", "step": 8}
        ]
      }</script>
    </m-map-japan>
  </div>
  <div class="concl"><span>→ 北から順に 8 つの地方に分ける</span></div>
</section>

<section class="slide">
  <h2>都道府県の人口（2020 年、国勢調査速報）</h2>
  <div class="body">
    <m-map-japan aria-label="都道府県別の人口の塗り分け" legend="人口" unit="万人" islands="all" style="height:440px">
      <script type="application/json">{
        "classes": [0, 100, 200, 500],
        "values": {"01": 523, "02": 124, "03": 121, "04": 230, "05": 96, "06": 107, "07": 183, "08": 287, "09": 193, "10": 194,
          "11": 735, "12": 629, "13": 1406, "14": 924, "15": 220, "16": 104, "17": 113, "18": 77, "19": 81, "20": 205,
          "21": 198, "22": 364, "23": 755, "24": 177, "25": 141, "26": 258, "27": 884, "28": 547, "29": 133, "30": 92,
          "31": 55, "32": 67, "33": 189, "34": 280, "35": 134, "36": 72, "37": 95, "38": 134, "39": 69, "40": 514,
          "41": 81, "42": 131, "43": 174, "44": 112, "45": 107, "46": 159, "47": 147}
      }</script>
    </m-map-japan>
  </div>
  <div class="concl"><span>→ 500 万人以上の 9 都道府県は大都市のまわり</span></div>
</section>

<section class="slide">
  <h2>北前船の西廻り航路（江戸時代）</h2>
  <div class="body">
    <m-map-japan aria-label="北前船の航路" labels="none" style="height:440px">
      <script type="application/json">{
        "points": [
          {"lon": 135.43, "lat": 34.65, "label": "大坂", "anchor": "below", "step": 1},
          {"lon": 130.94, "lat": 33.96, "label": "下関", "anchor": "left", "step": 2},
          {"lon": 139.84, "lat": 38.91, "label": "酒田", "anchor": "right", "step": 3},
          {"lon": 140.10, "lat": 41.43, "label": "松前", "anchor": "left", "step": 4}
        ],
        "flows": [
          {"from": [135.43, 34.65], "to": [130.94, 33.96], "step": 2,
           "via": [[135.15, 34.5], [134.9, 34.6], [134.5, 34.42], [134.0, 34.41], [133.4, 34.18], [133.08, 34.08], [132.9, 34.15], [132.72, 34.08], [132.52, 33.8], [132.1, 33.62], [131.7, 33.84], [131.3, 33.85]]},
          {"from": [130.94, 33.96], "to": [139.84, 38.91], "label": "日本海", "labelAt": [134.6, 38.4], "step": 3,
           "via": [[130.5, 34.35], [130.85, 35.0], [131.5, 35.45], [132.4, 35.9], [133.2, 36.6], [134.3, 36.25], [135.3, 36.35], [136.2, 37.0], [136.45, 37.75], [137.4, 38.0], [138.0, 38.55], [138.8, 38.8], [139.4, 39.0]]},
          {"from": [139.84, 38.91], "to": [140.10, 41.43], "step": 4,
           "via": [[139.75, 39.4], [139.5, 40.0], [139.75, 40.6], [139.95, 41.2]]}
        ]
      }</script>
    </m-map-japan>
  </div>
  <div class="concl"><span>→ 大坂から瀬戸内海・日本海を通って北へ</span></div>
</section>

<section class="slide">
  <h2>日本の範囲（本当の位置）</h2>
  <!-- 東西南北の端：国土地理院「日本の東西南北端点の経度緯度」（https://www.gsi.go.jp/KOKUJYOHO/center.htm、2026-10-25 取得）。
       東端 南鳥島 153°59′12″E・24°16′59″N、西端 与那国島 122°55′57″E・24°27′05″N、
       南端 沖ノ鳥島 136°04′11″E・20°25′31″N、北端 択捉島 148°45′08″E・45°33′26″N（度に直して小数 4 桁に丸めた） -->
  <div class="body">
    <m-map-japan aria-label="日本の範囲と東西南北の端" layout="true" labels="none" style="height:440px">
      <script type="application/json">{
        "points": [
          {"lon": 148.7522, "lat": 45.5572, "label": "択捉島（北端）", "step": 1},
          {"lon": 153.9867, "lat": 24.2831, "label": "南鳥島（東端）", "step": 2},
          {"lon": 136.0697, "lat": 20.4253, "label": "沖ノ鳥島（南端）", "step": 3},
          {"lon": 122.9325, "lat": 24.4514, "label": "与那国島（西端）", "step": 4}
        ]
      }</script>
    </m-map-japan>
  </div>
  <div class="concl"><span>→ 東西は経度で約 31°、南北は緯度で約 25° に広がる</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 28px;text-align:center;font-size:27px">
      <div>フェード（fade、既定）</div><div>西から順に（sweep）</div><div>輪郭から（draw）</div>
      <m-map-japan variant="fade" labels="none" style="height:380px">
        <script type="application/json">{"regions": [{"group": "kinki", "tone": "term"}, {"group": "kyushu", "tone": "emph"}, {"id": "01", "tone": "accent2"}]}</script>
      </m-map-japan>
      <m-map-japan variant="sweep" labels="none" style="height:380px">
        <script type="application/json">{"regions": [{"group": "kinki", "tone": "term"}, {"group": "kyushu", "tone": "emph"}, {"id": "01", "tone": "accent2"}]}</script>
      </m-map-japan>
      <m-map-japan variant="draw" labels="none" style="height:380px">
        <script type="application/json">{"regions": [{"group": "kinki", "tone": "term"}, {"group": "kyushu", "tone": "emph"}, {"id": "01", "tone": "accent2"}]}</script>
      </m-map-japan>
    </div>
  </div>
  <div class="concl"><span>→ 書かなければ最初の見せ方（fade）になる</span></div>
</section>

</div>
</body>
</html>
