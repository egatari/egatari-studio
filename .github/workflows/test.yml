name: test

# Where the tests run (RELEASING.md step 3): Linux and Windows run everything on every run. macOS runs the full npm test (and its clean and pack legs)
# only on a push to main, a push of a release or rc tag (v*), and a dispatch with full=true (gh workflow run test.yml --ref <branch> -f full=true).
# Other runs (branch dispatches, pull requests) run the platform-sensitive set there (npm test -- --platform: builds, checks, unit tests, paths,
# fonts, WebKit, npm pack, and the clean environment), in one job. The condition is written out where it is used (jobs.<id>.if and strategy cannot read env):
#   github.event_name == 'push' || inputs.full
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'macOS: run the full npm test and the macOS clean and pack jobs (default: the platform-sensitive set)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Generated files (committed: Pages and users need them) must match their sources, and changes/*.md fragments must be well formed.
  # Also in npm test; this job fails fast with a clear message. Fix with: npm run gen
  # A pull request (or a run on another branch) that changes code without adding a changes/*.md fragment gets a warning, not a failure.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Generated files, vendored components and changelog fragments (npm run gen:check)
        # gen:check starts with npm run components:check: vendor/components (copies of egatari/components releases) matches
        # components.lock.json (every version present, every index.js hash). No network: Studio builds only from the vendored copies.
        run: npm run gen:check
      - name: Changelog fragment for code changes (warning only)
        if: github.ref != 'refs/heads/main'
        run: node tools/changelog.mjs --check --base "origin/${{ github.base_ref || 'main' }}"

  # Tier 1: build, check, and browser tests. No TTS, no ffmpeg.
  # Fonts: fonts/*.ttf are not in the repo, so build embeds BIZ UDPGothic from @fontsource (no system CJK fonts needed).
  # Browser: kit/browser.mjs tries CHROME_PATH, then Google Chrome, then Playwright's Chromium (installed below).
  test:
    runs-on: ubuntu-latest
    # Linux: npm test now runs past 45 min (test 24 on v0.6-integration was cancelled at 45 min while still passing; test-components alone takes about 545 s), so the job and each test-all step get more time
    # With npm test -- --jobs 3 (backlog #156) the tests took 22-33 min here in the green runs of the v0.6.4-ci-parallel branch (39 min one at a time in run 41300438072); the cap is unchanged
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # floors: the 2026-10-20/21 Node security release (SECURITY.md#node-versions); the runner's cached 22.x/24.x can be older
          node-version: ${{ matrix.node == 22 && '>=22.23.4 <23' || '>=24.22.1 <25' }}
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Stale English/Japanese document pairs (warnings only)
        # X.ja.md older than X.md (or the reverse) shows as a warning annotation; it does not fail the build (add --strict to make it fail)
        if: matrix.node == 22
        run: node tools/i18n-pairs.mjs --check
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium
      - name: npm test
        # CI=true makes tools/test-all.mjs stream every test's output; MOTION_TEST_ARTIFACTS: screenshots go to a fixed folder that the upload step reads
        env:
          MOTION_TEST_ARTIFACTS: ${{ runner.temp }}/motion-test-artifacts
          TEST_STEP_TIMEOUT_S: '900'
        # --jobs 3: three test-all steps at a time on the 4-vCPU runner, timing-sensitive tests (// test-all: serial) last and alone (backlog #156)
        run: npm test -- --jobs 3
      - name: Upload screenshots on failure
        # Only small diagnostics (png, json, txt, log): built decks, audio and fonts copied into the work dirs made the artifact ~450 MB
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/motion-test-artifacts/**/*.png
            ${{ runner.temp }}/motion-test-artifacts/**/*.json
            ${{ runner.temp }}/motion-test-artifacts/**/*.txt
            ${{ runner.temp }}/motion-test-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 3

  # Tier 1 on Windows: paths (C:\...), file:// URLs, CRLF checkouts. Uses the preinstalled Google Chrome (no Playwright Chromium).
  windows:
    runs-on: windows-latest
    # Windows: npm test now runs past 45 min (cancelled at 45 min on v0.6-integration while still passing; test-components alone takes about 575 s, near the default 600 s step cap), so the job and each test-all step get more time
    # 60 min became too short: main took 56 min (run 41300438072) and a branch with more tests reached the cap still passing (run 41320179850). #156 runs the steps in parallel
    # With npm test -- --jobs 3 (backlog #156) the tests took 26-34 min here in the green runs of the v0.6.4-ci-parallel branch (55 min one at a time in run 41300438072); the cap is unchanged
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          MOTION_TEST_ARTIFACTS: ${{ runner.temp }}/motion-test-artifacts
          TEST_STEP_TIMEOUT_S: '900'
        # --jobs 3 (backlog #156): see the test job
        run: npm test -- --jobs 3
      - name: Upload screenshots on failure
        # Only small diagnostics (png, json, txt, log): built decks, audio and fonts copied into the work dirs made the artifact ~450 MB
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-windows
          path: |
            ${{ runner.temp }}/motion-test-artifacts/**/*.png
            ${{ runner.temp }}/motion-test-artifacts/**/*.json
            ${{ runner.temp }}/motion-test-artifacts/**/*.txt
            ${{ runner.temp }}/motion-test-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 3

  # Tier 1 on macOS: a case-insensitive file system (APFS) and /var → /private/var temp paths, the macOS fonts, and WebKit (Playwright's, closest to Safari). Uses the preinstalled Google Chrome.
  # Full runs (see the top) run all of npm test here; other runs the platform-sensitive set (npm test -- --platform, 94 of 157 steps: 11.5 min against 64-69 min for all, run 41957733017), then tools/clean-env.mjs
  # (the clean job's macOS leg; test-npm-pack in the set is the pack job's), so a branch run asks for one macOS runner instead of three.
  # Why: on the 3-vCPU, 7 GB arm64 runner npm test took 37-89 min (median 62) in the 86 macOS jobs of 2026-11-03/04, and 33 of the 62 that finished failed, mostly in a different test each time;
  # macOS jobs also waited for a runner ("not acquired by Runner ... after multiple attempts" after 15-40 min, 7 jobs) and one runner lost contact mid-run (41795793989).
  # Earlier: test-components reached the 1200 s step cap here and is split into two test-all steps; with --jobs 3 (backlog #156) other runs slowed every step about 2x.
  # --jobs 2 with the memory-heavy steps one at a time (tools/test-all.mjs HEAVY, automatic under 12 GiB): when two of them overlapped, both ran about 3x slower
  # (test-app 340-600 s → 1100-1300 s, test-pack-catalogue 200-330 s → 630-830 s; on the occasional 14 GB runner 390-450 s even when they overlapped).
  # One at a time, three full runs (41933828143, 41942340958, 41950024877) were green in 64-69 min, test-app 728-797 s; swap still grew by 0.7-1.1 GB while test-app ran
  # TEST_TIMEOUT_SCALE 3: every wait's cap (tools/wait-scale.mjs, Playwright's 30 s default in kit/browser.mjs, the 600 s step cap) is 3x here; the waits end
  # when their condition holds, so a passing run is not slower. Linux and Windows keep the factor 1
  macos:
    runs-on: macos-latest
    timeout-minutes: ${{ (github.event_name == 'push' || inputs.full) && 90 || 40 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0   # tools/clean-env.mjs runs tts/synth.py --dry-run
        if: ${{ !(github.event_name == 'push' || inputs.full) }}
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Install Playwright WebKit
        # test-viewer-webkit, test-touch, test-book-css, test-fullscreen and test-print-backgrounds also run in WebKit when it is installed (they skip otherwise)
        run: npx playwright-core install webkit
      # (written as !full && '--platform' || '': an empty string after && is false and would always pick the second value)
      - name: npm test${{ !(github.event_name == 'push' || inputs.full) && ' -- --platform' || '' }}
        env:
          MOTION_TEST_ARTIFACTS: ${{ runner.temp }}/motion-test-artifacts
          TEST_TIMEOUT_SCALE: '3'
          TEST_STEP_TIMEOUT_S: '1800'
        run: npm test -- --jobs 2 ${{ !(github.event_name == 'push' || inputs.full) && '--platform' || '' }}
      - name: Clean environment (the clean job's macOS leg)
        # the same as the clean job: an empty HOME (so no Playwright browsers and no user theme folder) and no TTS server
        if: ${{ !(github.event_name == 'push' || inputs.full) }}
        shell: bash
        run: |
          H="$RUNNER_TEMP/empty-home"
          mkdir -p "$H"
          HOME="$H" IRODORI_URL=http://127.0.0.1:9 node tools/clean-env.mjs
      - name: Upload screenshots on failure
        # Only small diagnostics (png, json, txt, log): built decks, audio and fonts copied into the work dirs made the artifact ~450 MB
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-macos
          path: |
            ${{ runner.temp }}/motion-test-artifacts/**/*.png
            ${{ runner.temp }}/motion-test-artifacts/**/*.json
            ${{ runner.temp }}/motion-test-artifacts/**/*.txt
            ${{ runner.temp }}/motion-test-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 3

  # Clean environment (backlog #50): an empty HOME (not USERPROFILE: Chrome does not start on Windows with an empty one), no TTS server (IRODORI_URL points at a closed port), no user theme
  # folder, the system browser only. tools/clean-env.mjs builds, checks and exports (--portable, --play-only) copies of every example,
  # runs tts/synth.py --dry-run and builds with its audio, and builds and checks decks made by npm run new. Also in RELEASING.md.
  clean:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macOS only on full runs (see the top); otherwise the macos job runs tools/clean-env.mjs after its platform-sensitive set
        os: ${{ fromJSON((github.event_name == 'push' || inputs.full) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Empty home
        run: |
          H="$RUNNER_TEMP/empty-home"
          mkdir -p "$H"
          echo "HOME=$H" >> "$GITHUB_ENV"
          echo "IRODORI_URL=http://127.0.0.1:9" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Build, check, export, TTS dry-run and new deck (tools/clean-env.mjs)
        run: node tools/clean-env.mjs

  # The npm package (backlog #157): npm pack (prepack writes the font copies in fonts/@fontsource), install the tarball in a temp folder outside the
  # repository (--prefer-offline: the dependencies come from the cache npm ci filled) and run npx egatari --version, doctor, new, check and build.
  # Uses the preinstalled Google Chrome. Also in npm test (test-npm-pack).
  pack:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS only on full runs (see the top); otherwise test-npm-pack runs in the macos job's platform-sensitive set
        os: ${{ fromJSON((github.event_name == 'push' || inputs.full) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Pack, install and run egatari (tools/test-npm-pack.mjs)
        run: node tools/test-npm-pack.mjs

  # Bun: the packed CLI under the Bun runtime (bunx --bun, so #!/usr/bin/env node runs Bun too), the same install as the pack job (tools/bun-check.mjs:
  # npm pack, npm install <tarball> in a temp folder outside the repository). Runs new, check, build and build --portable, and fails if a build's bytes
  # differ from Node's build of the same folder. Linux only, Bun pinned (1.4.4 was tested by hand; change the pin on purpose). Uses the preinstalled Google Chrome.
  # README: "Also runs with Bun (bunx egatari)"; npx egatari stays the documented way
  bun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.4.4
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Bun runs the packed egatari like Node (tools/bun-check.mjs)
        run: node tools/bun-check.mjs

  # Tier 2 (fast): TTS pipeline in --dry-run (silent placeholder audio, no TTS server) and video render of two steps.
  # Also on Windows (Git Bash): the same steps with ffmpeg from Chocolatey.
  tier2:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      - name: Samples of all parts (tools/test-parts-gallery.mjs --build)
        # build-app --parts: the gallery of the default parts library from the vendored release, /parts/ in the site, and kit/check.mjs error 0 (#158)
        if: runner.os == 'Linux'
        run: node tools/test-parts-gallery.mjs --build
      - name: TTS --dry-run on a copy of examples/minimal
        run: |
          D="$RUNNER_TEMP/deck"
          cp -R examples/minimal "$D"
          rm -rf "$D/out"
          uv run --project tts python tts/synth.py "$D" --dry-run
          test -f "$D/audio/manifest.json"
          node kit/build.mjs "$D/deck.html"
      - name: Render two steps
        run: |
          D="$RUNNER_TEMP/deck"
          set +e
          node render/render.mjs "$D/out/deck.html" --out "$RUNNER_TEMP/video" --only "更新の式:1,更新の式:2"
          code=$?
          set -e
          # exit 2 = "timeline.out.json incomplete", expected with --only
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "render failed ($code)"; exit 1; fi
          n=0
          for f in "$RUNNER_TEMP"/video/clip_*.mp4; do
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            aud=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$f")
            echo "$f: ${dur}s audio=${aud}"
            awk -v d="$dur" 'BEGIN{exit !(d > 0.5)}' || { echo "clip too short: $f"; exit 1; }
            [ -n "$aud" ] || { echo "no audio stream: $f"; exit 1; }
            n=$((n+1))
          done
          [ "$n" -eq 2 ] || { echo "expected 2 clips, got $n"; exit 1; }
