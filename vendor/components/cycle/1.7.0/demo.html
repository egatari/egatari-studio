<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-cycle の見本</title>
<!-- 組み方：node kit/build.mjs components/cycle/demo.html -o components/cycle/out/demo.html -->
<style>
.vcap{font-size:27px;line-height:1.3;margin:0 0 6px;color:var(--muted)}
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>PDCA サイクル</h2>
  <div class="body">
    <m-cycle style="height:430px">
      <script type="application/json">{
        "center": {"label": "PDCA"},
        "nodes": [
          {"label": "計画（Plan）", "note": "目標と手順を決める"},
          {"label": "実行（Do）", "note": "計画どおりにやってみる"},
          {"label": "評価（Check）", "note": "結果を目標と比べる"},
          {"label": "改善（Act）", "note": "やり方を直して次へ", "tone": "emph"}
        ]
      }</script>
    </m-cycle>
  </div>
  <div class="concl"><span>→ 1 周ごとに、やり方が少しずつよくなる</span></div>
</section>

<section class="slide">
  <h2>水の循環</h2>
  <div class="body">
    <m-cycle style="height:430px">
      <script type="application/json">{
        "center": {"label": "水の循環", "note": "太陽の熱で動く"},
        "nodes": [
          {"label": "蒸発", "note": "海や地面の水が水蒸気に"},
          {"label": "雲ができる", "note": "上空で冷えて水や氷の粒に"},
          {"label": "雨・雪", "note": "粒が大きくなって落ちる"},
          {"label": "しみこむ・流れる", "note": "地下水や川になる"},
          {"label": "海へ", "note": "川が海に注ぐ"}
        ]
      }</script>
    </m-cycle>
  </div>
  <div class="concl"><span>→ 水は形を変えながら、地球の上を回り続ける</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 36px">
      <div><p class="vcap">現れてから矢印（fade、既定）</p>
        <m-cycle variant="fade" style="height:360px">
          <script type="application/json">{"nodes": [{"label": "計画"}, {"label": "実行"}, {"label": "評価"}, {"label": "改善"}]}</script>
        </m-cycle></div>
      <div><p class="vcap">矢印を引いてから（draw）</p>
        <m-cycle variant="draw" style="height:360px">
          <script type="application/json">{"nodes": [{"label": "計画"}, {"label": "実行"}, {"label": "評価"}, {"label": "改善"}]}</script>
        </m-cycle></div>
      <div><p class="vcap">前の箱の側から大きくなる（grow）</p>
        <m-cycle variant="grow" style="height:360px">
          <script type="application/json">{"nodes": [{"label": "計画"}, {"label": "実行"}, {"label": "評価"}, {"label": "改善"}]}</script>
        </m-cycle></div>
    </div>
  </div>
  <div class="concl"><span>→ 資料のシード値（data-egatari-seed）で 1 つが選ばれる</span></div>
</section>

</div>
</body>
</html>
