# Editor app (app/) on GitHub Pages: builds dist with tools/build-app.mjs and deploys it.
#   /             the hosted editor (loads only the font files a deck needs)
#   /editor.html  the single-file editor (all fonts embedded, ~10 MB)
#   /lab/         test pages copied as-is from lab/ (lab/irodori.html: Irodori-TTS in the browser on WebGPU)
#   /editor/      redirects to / keeping ?query and #hash (the editor used to live here)
#   /examples/    the examples as portable files (<name>.ega.html), listed on the editor's first screen
#   /vX.Y.Z/      a frozen copy of each release (the same layout under its own path; #32). The new build is copied to /v<its version>/,
#                 and every earlier release's editor-site-vX.Y.Z.tar.gz (a release asset, RELEASING.md) is downloaded, checked against
#                 the sha256 line in its release notes (and GitHub's digest) and unpacked (tools/site-versions.mjs assemble)
#   /versions.json  the root version and the frozen copies (the editor shows a version list and, in a copy, a notice)
# All paths are relative: the site works at the custom domain https://studio.egatari.org/ (whole site)
# and at https://egatari.github.io/egatari-studio/.
# Only release tags deploy: a push of vX.Y.Z (three numbers; v0.6.0-rc.1 and other rc tags do not), or "Run workflow" on such a tag
# (to deploy that release again). Pushes to main and pull requests only build (so a broken build is caught before a release);
# "Run workflow" on a branch is a dry build. See RELEASING.md.
# Needs: Settings -> Pages -> Source: GitHub Actions; the variable EDITOR_PAGES = true (until then nothing deploys);
# and the github-pages environment must allow tags v*.*.* (Settings -> Environments -> github-pages -> Deployment branches and tags).
# See docs/editor.md#publishing-on-github-pages
name: pages

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    # paths do not apply to tag pushes: every release tag builds and deploys
    paths:
      - 'app/**'
      - 'assets/logo/**'
      - 'lab/**'
      - 'tts/voices/**'
      - 'kit/**'
      - 'vendor/components/**'
      - 'components.lock.json'
      - 'tools/vendor-components.mjs'
      - 'themes/**'
      - 'vendor/themes/**'
      - 'themes.lock.json'
      - 'server/hints.js'
      - 'server/editor-ui.js'
      - 'tools/build-app.mjs'
      - 'tools/examples-portable.mjs'
      - 'tools/site-versions.mjs'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/logo/**'
      - 'lab/**'
      - 'tts/voices/**'
      - 'kit/**'
      - 'vendor/components/**'
      - 'components.lock.json'
      - 'tools/vendor-components.mjs'
      - 'themes/**'
      - 'vendor/themes/**'
      - 'themes.lock.json'
      - 'server/hints.js'
      - 'server/editor-ui.js'
      - 'tools/build-app.mjs'
      - 'tools/examples-portable.mjs'
      - 'tools/site-versions.mjs'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Release tag?
        id: release
        # deploy only for vX.Y.Z tags (the push filter above also lets nothing else through, but "Run workflow" can pick any ref)
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "${{ vars.EDITOR_PAGES }}" = "true" ]; then d=true; else d=false; fi
          echo "deploy=$d" >> "$GITHUB_OUTPUT"
          echo "ref $GITHUB_REF: deploy=$d"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Build the editor
        run: node tools/build-app.mjs --out _site
      - name: Check the build
        run: test -s _site/index.html && test -s _site/editor.html && ls -la _site
      - name: Add the frozen copies (/vX.Y.Z/)
        # on a release tag the tag must equal package.json's version; other refs use package.json's version (the same steps as a dry run).
        # A release without the asset is skipped (v0.4.0 and earlier); a wrong sha256 or a missing sha256 line fails the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then cur=(--current "${BASH_REMATCH[1]}"); else cur=(); fi
          node tools/site-versions.mjs assemble --site _site "${cur[@]}" --repo "$GITHUB_REPOSITORY"
          cat _site/versions.json
      - uses: actions/configure-pages@v6
        if: steps.release.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.release.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
