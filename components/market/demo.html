<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-market の見本</title>
<!-- 組み方：node kit/build.mjs components/market/demo.html -o components/market/out/demo.html（数値はすべて架空） -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>市場の大きさ（架空）</h2>
  <div class="body">
    <m-market unit="億円" style="height:420px">
      <script type="application/json">{
        "rings": [
          {"key": "TAM", "value": 2400, "basis": "社内文書を書くすべての時間"},
          {"key": "SAM", "value": 520, "basis": "定型の報告書（月報・週報）"},
          {"key": "SOM", "value": 26, "basis": "5 年で取る中堅企業 800 社"}
        ]
      }</script>
    </m-market>
  </div>
  <div class="concl"><span>→ まず定型の報告書から始める</span></div>
</section>

<section class="slide">
  <h2>面積を値に比例させる</h2>
  <div class="body">
    <m-market unit="万人" scale="area" layout="center" count="true" style="height:420px">
      <script type="application/json">{
        "rings": [
          {"key": "全体", "value": 900, "basis": "架空の母集団"},
          {"key": "対象", "value": 300, "basis": "条件に合う人"},
          {"key": "初年度", "value": 12, "basis": "最初に届く人"}
        ]
      }</script>
    </m-market>
  </div>
  <div class="concl"><span>→ 面積で見ると最初の一歩は小さい</span></div>
</section>

</div>
</body>
</html>
