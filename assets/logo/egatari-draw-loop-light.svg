<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">Egatari / stroke drawing loop / light</title><desc id="desc">太陽、え、かぎ括弧の順に 2.5 秒で描き、約 1 秒止めて約 0.4 秒で消すことをくり返す。動きを減らす設定では完成形。</desc>
<style>
/* 描く 2.5 秒 → 止め 1.0 秒 → 消す 0.4 秒をくり返す（1 回 3.9 秒）。動きを減らす設定では完成形のまま */
.sun{animation:sun-loop 3.9s linear infinite;transform-box:fill-box;transform-origin:center}
.glyph{stroke-dasharray:1;animation:glyph-loop 3.9s linear infinite}
.bracket{stroke-dasharray:1;animation:bracket-loop 3.9s linear infinite}
@keyframes sun-loop{0%{opacity:0;transform:scale(.7);animation-timing-function:ease-out}7.69%{opacity:1;transform:scale(1)}89.74%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@keyframes glyph-loop{0%,8.97%{opacity:0;stroke-dashoffset:1;animation-timing-function:ease-in-out}9.23%{opacity:1}47.44%{opacity:1;stroke-dashoffset:0}89.74%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
@keyframes bracket-loop{0%,48.72%{opacity:0;stroke-dashoffset:1;animation-timing-function:ease-out}48.97%{opacity:1}64.10%{opacity:1;stroke-dashoffset:0}89.74%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.sun,.glyph,.bracket{animation:none;opacity:1;transform:none;stroke-dasharray:none;stroke-dashoffset:0}}
</style><circle cx="112" cy="66" r="12.5" fill="#D3381C" class="sun"/><path d="M80 107Q121 103 160 94Q170 92 163 102L78 184L110 151Q128 132 135 158L139 175Q146 197 168 183Q184 173 177 161L170 163" fill="none" stroke="#4A488E" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" class="glyph" pathLength="1" transform="translate(-1 2)"/><path d="M84 40H40V152" fill="none" stroke="#4A488E" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" class="bracket" pathLength="1"/><path d="M172 216H216V104" fill="none" stroke="#4A488E" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter" class="bracket" pathLength="1"/>
</svg>
