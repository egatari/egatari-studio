<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-cards の見本</title>
<!-- 組み方：node kit/build.mjs components/cards/demo.html -o components/cards/out/demo.html（会社と数字はすべて架空） -->
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>新しい窓口の進め方（架空の会社）</h2>
  <div class="body">
    <m-cards arrows nums style="height:330px">
      <script type="application/json">{
        "cards": [
          {"icon": "messages", "title": "聞く", "text": "店に来た人の困りごとを 5 分で聞き取る"},
          {"icon": "clipboard-list", "title": "まとめる", "text": "聞いたことを 1 枚の紙にまとめる"},
          {"icon": "users", "title": "相談する", "text": "週に 1 回、担当の 3 人で話し合う"},
          {"icon": "circle-check", "title": "返す", "text": "1 週間以内に答えを返す"}
        ]
      }</script>
    </m-cards>
  </div>
  <div class="concl"><span>→ 聞いてから答えるまでを 1 週間に</span></div>
</section>

<section class="slide">
  <h2>4 つの店の工夫（架空）</h2>
  <div class="body">
    <m-cards layout="grid" hilite="4" style="height:420px">
      <script type="application/json">{
        "cards": [
          {"n": "A", "icon": "building-store", "title": "駅前店", "text": "朝の 30 分だけ、受け取り専用の列を作った"},
          {"n": "B", "icon": "calendar-event", "title": "川沿い店", "text": "予約の日を前の日に電話で知らせるようにした"},
          {"n": "C", "icon": "map-pin", "title": "山の手店", "text": "店の場所の地図を、紙で配るのをやめて看板にした"},
          {"n": "D", "icon": "chart-bar", "title": "港町店", "text": "待ち時間を毎日数えて、壁に貼り出した。来た人の 8 割が「待ちが短くなった」と答えた", "tone": "emph"}
        ]
      }</script>
    </m-cards>
  </div>
  <div class="concl"><span>→ 数えて見せた店で、待ちが短くなったと感じる人がいちばん多い</span></div>
</section>

<section class="slide">
  <h2>まとめて出す（per-step="0"、見せ方 draw）</h2>
  <div class="body">
    <m-cards per-step="0" variant="draw" hilite="last" style="height:300px">
      <script type="application/json">{
        "cards": [
          {"icon": "leaf", "title": "材料", "text": "地元の野菜を使う"},
          {"icon": "truck", "title": "運ぶ", "text": "朝に届けて、その日のうちに売る"},
          {"icon": "heart", "title": "残さない", "text": "売れ残りは翌日の総菜に"}
        ]
      }</script>
    </m-cards>
  </div>
</section>

</div>
</body>
</html>
