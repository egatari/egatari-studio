<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部品庫 2.0 の受け口</title>
<!-- tools/test-parts-host.mjs の試験用の教材（部品庫 2.0。egatari.json の componentsCatalogue） -->
</head>
<body>
<div id="stage">

<section class="slide" id="p-one">
  <h2>棒と試験のパーツ</h2>
  <div class="body">
    <m-bars aria-label="売上" style="height:300px"><script type="application/json">
      {"series": [{"label": "売上"}], "groups": [{"label": "1 年目", "value": 1.2}, {"label": "2 年目", "value": 3.4}, {"label": "\u307b", "value": 2}]}
    </script></m-bars>
    <m-probe id="probe-a" data-from="1" style="display:block;width:400px;height:40px"></m-probe>
  </div>
  <div class="concl"><span>⇒ 2.0 のパーツが動く</span></div>
</section>

<section class="slide" id="p-two">
  <h2>失敗を止める</h2>
  <div class="body">
    <m-probe id="probe-render" fail="render" aria-label="描けない試験のパーツ" style="display:inline-block;width:280px;height:90px;vertical-align:top"></m-probe>
    <m-probe id="probe-mount" fail="mount" aria-label="mount で止まるパーツ" style="display:inline-block;width:280px;height:90px;vertical-align:top"></m-probe>
    <m-probe id="probe-report" report="size" style="display:inline-block;width:280px;height:90px;vertical-align:top"></m-probe>
    <m-boom aria-label="作れないパーツ" style="display:inline-block;width:280px;height:90px;vertical-align:top"></m-boom>
    <m-orphan aria-label="頼る先が作れないパーツ" style="display:inline-block;width:280px;height:90px;vertical-align:top"></m-orphan>
    <m-nonlit aria-label="読めない meta のパーツ" style="display:inline-block;width:280px;height:90px;vertical-align:top"></m-nonlit>
    <p data-step="1">段階 1 の字</p>
  </div>
</section>

<section class="slide" id="p-three">
  <h2>組み立てのときの式</h2>
  <div class="body">
    <m-flow aria-label="入力から重みへ" style="height:300px;width:900px"><script type="application/json">
      {"nodes": [{"id": "a", "label": "入力", "tex": "x_1", "x": 40, "y": 100, "w": 240, "h": 100},
                 {"id": "b", "label": "重み", "tex": "\\theta^2", "x": 560, "y": 100, "w": 240, "h": 100}],
       "edges": [{"from": "a", "to": "b"}]}
    </script></m-flow>
  </div>
</section>

<section class="slide" id="p-four">
  <h2>絞り込み</h2>
  <div class="body">
    <m-kakijun text="あさ&#x3072;" aria-label="あさの書き順" style="height:340px;width:900px"></m-kakijun>
  </div>
</section>

</div>
</body>
</html>
