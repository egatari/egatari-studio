<!DOCTYPE html>
<html lang="ja" data-theme="kokugo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-kanbun の見本</title>
<!-- 組み方：node kit/build.mjs components/kanbun/demo.html -o components/kanbun/out/demo.html -->
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>孟浩然「春暁」</h2>
  <div class="body">
    <m-kanbun style="height:430px">
      春眠不{=ず}レ覚(エ)レ暁(ヲ)
      処処聞(ク)[二]啼鳥(ヲ)[一]
      夜来風雨(ノ)声
      花落(ツルコト)知(ル)多少
    </m-kanbun>
  </div>
  <div class="concl"><span>返り点に従って下から上へ戻って読む</span></div>
</section>

<section class="slide">
  <h2>レ点・一二点・一レ点（『史記』）</h2>
  <div class="body">
    <m-kanbun style="height:430px">
      先(ンズレバ)即(チ)制(シ)[レ]人(ヲ)、
      後(ルレバ)則(チ)為(ル)[二]人(ノ)所(ト)[一レ]制(スル)
    </m-kanbun>
  </div>
  <div class="concl"><span>一レ点は、レ点で戻ってから二へ戻る</span></div>
</section>

<section class="slide">
  <h2>再読文字と置き字（『論語』）</h2>
  <div class="body">
    <m-kanbun style="height:430px">
      未(ダ|ず)[レ]知(ラ)[レ]生(ヲ)、
      焉{いづく}(ンゾ)知(ラン)[レ]死(ヲ)
      学(ビテ)而{-}時(ニ)習(フ)[レ]之(ヲ)
    </m-kanbun>
  </div>
  <div class="concl"><span>再読文字は二度読み、置き字は読まない</span></div>
</section>

</div>
</body>
</html>
