name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Generated files (committed: Pages and users need them) must match their sources, and changes/*.md fragments must be well formed.
  # Also in npm test; this job fails fast with a clear message. Fix with: npm run gen
  # A pull request (or a run on another branch) that changes code without adding a changes/*.md fragment gets a warning, not a failure.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Generated files, vendored components and changelog fragments (npm run gen:check)
        # gen:check starts with npm run components:check: vendor/components (copies of egatari/components releases) matches
        # components.lock.json (every version present, every index.js hash). No network: Studio builds only from the vendored copies.
        run: npm run gen:check
      - name: Changelog fragment for code changes (warning only)
        if: github.ref != 'refs/heads/main'
        run: node tools/changelog.mjs --check --base "origin/${{ github.base_ref || 'main' }}"

  # Tier 1: build, check, and browser tests. No TTS, no ffmpeg.
  # Fonts: fonts/*.ttf are not in the repo, so build embeds BIZ UDPGothic from @fontsource (no system CJK fonts needed).
  # Browser: kit/browser.mjs tries CHROME_PATH, then Google Chrome, then Playwright's Chromium (installed below).
  test:
    runs-on: ubuntu-latest
    # Linux took up to 28 min on main (test 22), so 30 min was too tight
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # floors: the 2026-10-20/21 Node security release (SECURITY.md#node-versions); the runner's cached 22.x/24.x can be older
          node-version: ${{ matrix.node == 22 && '>=22.23.4 <23' || '>=24.22.1 <25' }}
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Stale English/Japanese document pairs (warnings only)
        # X.ja.md older than X.md (or the reverse) shows as a warning annotation; it does not fail the build (add --strict to make it fail)
        if: matrix.node == 22
        run: node tools/i18n-pairs.mjs --check
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium
      - name: npm test
        # CI=true makes tools/test-all.mjs stream every test's output; MOTION_TEST_ARTIFACTS: screenshots go to a fixed folder that the upload step reads
        env:
          MOTION_TEST_ARTIFACTS: ${{ runner.temp }}/motion-test-artifacts
        run: npm test
      - name: Upload screenshots on failure
        # Only small diagnostics (png, json, txt, log): built decks, audio and fonts copied into the work dirs made the artifact ~450 MB
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/motion-test-artifacts/**/*.png
            ${{ runner.temp }}/motion-test-artifacts/**/*.json
            ${{ runner.temp }}/motion-test-artifacts/**/*.txt
            ${{ runner.temp }}/motion-test-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 3

  # Tier 1 on Windows: paths (C:\...), file:// URLs, CRLF checkouts. Uses the preinstalled Google Chrome (no Playwright Chromium).
  windows:
    runs-on: windows-latest
    # Windows took up to 26.5 min, so 30 min was too tight
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          MOTION_TEST_ARTIFACTS: ${{ runner.temp }}/motion-test-artifacts
        run: npm test
      - name: Upload screenshots on failure
        # Only small diagnostics (png, json, txt, log): built decks, audio and fonts copied into the work dirs made the artifact ~450 MB
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-windows
          path: |
            ${{ runner.temp }}/motion-test-artifacts/**/*.png
            ${{ runner.temp }}/motion-test-artifacts/**/*.json
            ${{ runner.temp }}/motion-test-artifacts/**/*.txt
            ${{ runner.temp }}/motion-test-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 3

  # Tier 1 on macOS: a case-insensitive file system (APFS) and /var → /private/var temp paths. Uses the preinstalled Google Chrome.
  macos:
    runs-on: macos-latest
    # macOS runners are slow: npm test takes 24-26 min here and new tests add about 2 min, so 30 min was too tight (clean on macOS takes under 2 min; its 25 min is enough)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: npm test
        env:
          MOTION_TEST_ARTIFACTS: ${{ runner.temp }}/motion-test-artifacts
        run: npm test
      - name: Upload screenshots on failure
        # Only small diagnostics (png, json, txt, log): built decks, audio and fonts copied into the work dirs made the artifact ~450 MB
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-macos
          path: |
            ${{ runner.temp }}/motion-test-artifacts/**/*.png
            ${{ runner.temp }}/motion-test-artifacts/**/*.json
            ${{ runner.temp }}/motion-test-artifacts/**/*.txt
            ${{ runner.temp }}/motion-test-artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 3

  # Clean environment (backlog #50): an empty HOME (not USERPROFILE: Chrome does not start on Windows with an empty one), no TTS server (IRODORI_URL points at a closed port), no user theme
  # folder, the system browser only. tools/clean-env.mjs builds, checks and exports (--portable, --play-only) copies of every example,
  # runs tts/synth.py --dry-run and builds with its audio, and builds and checks decks made by npm run new. Also in RELEASING.md.
  clean:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Empty home
        run: |
          H="$RUNNER_TEMP/empty-home"
          mkdir -p "$H"
          echo "HOME=$H" >> "$GITHUB_ENV"
          echo "IRODORI_URL=http://127.0.0.1:9" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Build, check, export, TTS dry-run and new deck (tools/clean-env.mjs)
        run: node tools/clean-env.mjs

  # Tier 2 (fast): TTS pipeline in --dry-run (silent placeholder audio, no TTS server) and video render of two steps.
  # Also on Windows (Git Bash): the same steps with ffmpeg from Chocolatey.
  tier2:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '>=22.23.4 <23'   # floor: the 2026-10-20/21 Node security release (SECURITY.md#node-versions)
          cache: npm
      - run: npm ci --ignore-scripts   # no install scripts (SECURITY.md#install-scripts)
      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx playwright-core install --with-deps chromium
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tts/uv.lock
      - name: TTS --dry-run on a copy of examples/minimal
        run: |
          D="$RUNNER_TEMP/deck"
          cp -R examples/minimal "$D"
          rm -rf "$D/out"
          uv run --project tts python tts/synth.py "$D" --dry-run
          test -f "$D/audio/manifest.json"
          node kit/build.mjs "$D/deck.html"
      - name: Render two steps
        run: |
          D="$RUNNER_TEMP/deck"
          set +e
          node render/render.mjs "$D/out/deck.html" --out "$RUNNER_TEMP/video" --only "更新の式:1,更新の式:2"
          code=$?
          set -e
          # exit 2 = "timeline.out.json incomplete", expected with --only
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then echo "render failed ($code)"; exit 1; fi
          n=0
          for f in "$RUNNER_TEMP"/video/clip_*.mp4; do
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            aud=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$f")
            echo "$f: ${dur}s audio=${aud}"
            awk -v d="$dur" 'BEGIN{exit !(d > 0.5)}' || { echo "clip too short: $f"; exit 1; }
            [ -n "$aud" ] || { echo "no audio stream: $f"; exit 1; }
            n=$((n+1))
          done
          [ "$n" -eq 2 ] || { echo "expected 2 clips, got $n"; exit 1; }
