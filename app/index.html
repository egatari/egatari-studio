<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 読み込めるのはアプリ自身だけ。デッキ（sandbox の iframe）もこの決まりを受け継ぎ、外へは繋がらない。frame-src 'none'：プレビューは srcdoc だけで、
     デッキが自分の iframe をアプリの origin（の URL に何かを載せて）や data: に移すことも止める。
     このページは文字列の eval を許さない（CSP の script-src に eval の許可を置かない）（部品庫 v1.0.0・1.0.1 の m-sweep・m-curves の式が new Function を使うので、その版は取り下げられた。format spec §6：取り下げた版の再生は
     エディタの origin の外（sandbox の枠）でだけ、このページの決まりを緩めない）。srcdoc の枠はこのページの決まりを受け継ぐので、取り下げた版の式は枠の中でも eval できず、図の代わりの表示になる。'wasm-unsafe-eval' は MP3 のエンコーダ（LAME の WebAssembly。app/mp3-loader.js）のためだけで、文字列の eval（eval・new Function）は許さない。worker-src blob: は持ち運べる 1 ファイルを読む Worker（アプリに同梱） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Egatari Studio</title>
<!--APP_ICONS-->
<!--APP_CSS-->
</head>
<body>
<header id="top">
  <!-- ロゴ：assets/logo/egatari-32-*.svg（24〜32 px の専用版）と同じ形。色はテーマ（明るい・暗い）で app.css の --logo-ink / --logo-sun -->
  <div class="brand"><svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false"><path class="ink" d="M10 5H5V18.5 M22 27H27V13.5" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/><circle class="sun" cx="14" cy="8.25" r="1.75"/><path class="ink" d="M10 13.5Q15.125 13 19.875 11.875Q21.125 11.625 20.25 12.875L9.75 23.25L13.75 19Q16 16.625 16.875 19.875L17.375 22Q18.25 24.5 20.75 23Q22.625 21.875 22 20.25" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="brand"></span></div>
  <div id="deckname" class="deckname"></div>
  <nav id="tools" hidden>
    <div class="menu">
      <button type="button" id="b-openmenu" aria-haspopup="menu" aria-expanded="false" aria-controls="m-open" data-t="openMenu"></button>
      <div id="m-open" class="menu-list" role="menu" hidden>
        <button type="button" id="b-openfile" role="menuitem" data-t="openFile"></button>
        <button type="button" id="b-open" role="menuitem" data-t="openFolderItem"></button>
        <button type="button" id="b-paste" role="menuitem"></button>
        <button type="button" id="b-themes" role="menuitem" data-t="themeFolderItem"></button>
      </div>
    </div>
    <div class="menu split only-portable" hidden>
      <button type="button" id="b-save" data-t="save"></button>
      <button type="button" id="b-savemenu" class="split-arrow" aria-haspopup="menu" aria-expanded="false" aria-controls="m-save" data-t-label="saveMore">▾</button>
      <div id="m-save" class="menu-list" role="menu" hidden>
        <button type="button" id="b-savenew" role="menuitem" data-t="saveNew"></button>
        <button type="button" id="b-saveas" role="menuitem" data-t="saveAs"></button>
      </div>
    </div>
    <span class="sep"></span>
    <button type="button" id="b-edit" data-t="edit" data-key="e"></button>
    <button type="button" id="b-narr" data-t="narr" data-key="n"></button>
    <button type="button" id="b-comments" data-t="comments" data-key="c"></button>
    <button type="button" id="b-audio" data-t="audio"></button>
    <button type="button" id="b-attach" data-t="attach" data-t-label="attachTip"></button>
    <span class="sep"></span>
    <button type="button" id="b-check" data-t="check"></button>
    <div class="menu">
      <button type="button" id="b-exportmenu" aria-haspopup="menu" aria-expanded="false" aria-controls="m-export" data-t="exportMenu"></button>
      <div id="m-export" class="menu-list" role="menu" hidden>
        <button type="button" id="b-unpack" class="only-portable" role="menuitem" data-t="exportFolder" hidden></button>
        <button type="button" id="b-export" class="only-folder" role="menuitem" data-t="export"></button>
        <button type="button" id="b-export-portable" class="only-folder" role="menuitem" data-t="exportPortable"></button>
        <button type="button" id="b-export-play" role="menuitem" data-t="exportPlayOnly"></button>
        <button type="button" id="b-export-live" role="menuitem" data-t="exportLive"></button>
        <button type="button" id="b-print" role="menuitem" data-t="print"></button>
      </div>
    </div>
    <button type="button" id="b-presenter" data-t="presenter"></button>
    <button type="button" id="b-full" data-t="full"></button>
    <span class="sep"></span>
    <button type="button" id="b-warn" class="warn" hidden></button>
    <button type="button" id="b-help" data-t="helpBtn"></button>
  </nav>
  <button type="button" id="b-lang" class="ghost lang" lang="en" title="English / 日本語"></button>
</header>

<div id="notice" role="alert" hidden></div>
<main>
  <section id="welcome">
    <div class="intro">
      <h1 data-t="welcomeTitle"></h1>
      <p data-t="welcomeLead"></p>
    </div>
    <div id="unsupported" class="note bad" hidden data-t="unsupported"></div>
    <div id="drop" class="drop" tabindex="0">
      <!-- assets/logo/egatari-*.svg（48 px 以上は master）と同じ形 -->
      <div class="drop-icon"><svg class="logo" viewBox="0 0 256 256" width="72" height="72" aria-hidden="true" focusable="false"><path class="ink" d="M84 40H40V152 M172 216H216V104" fill="none" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter"/><circle class="sun" cx="112" cy="66" r="12.5"/><path class="ink" d="M80 107Q121 103 160 94Q170 92 163 102L78 184L110 151Q128 132 135 158L139 175Q146 197 168 183Q184 173 177 161L170 163" fill="none" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1 2)"/></svg></div>
      <div data-t="dropHere"></div>
      <div class="row">
        <button type="button" id="w-openfile" class="pri" data-t="openFile"></button>
        <button type="button" id="w-new" data-t="newDeck"></button>
        <button type="button" id="w-paste"></button>
      </div>
      <p class="secondary"><span data-t="folderFor"></span> <button type="button" id="w-open" class="ghost" data-t="openFolder"></button></p>
    </div>
    <details id="kinds" class="card kinds" open>
      <summary data-t="kindsTitle"></summary>
      <table>
        <tr><th scope="row" data-t="kindFolder"></th><td data-t="kindFolderText"></td></tr>
        <tr><th scope="row" data-t="kindFile"></th><td data-t="kindFileText"></td></tr>
        <tr><th scope="row" data-t="kindPlay"></th><td data-t="kindPlayText"></td></tr>
        <tr><th scope="row" data-t="kindBuilt"></th><td data-t="kindBuiltText"></td></tr>
      </table>
    </details>
    <div id="newform" class="card" hidden>
      <h2 data-t="newDeck"></h2>
      <label><span data-t="newTitle"></span><input id="n-title" type="text"></label>
      <label><span data-t="newLang"></span><select id="n-lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
      <label><span data-t="newTheme"></span><select id="n-theme"></select></label>
      <p class="hint" data-t="newHint"></p>
      <div class="row"><button type="button" id="n-cancel" data-t="cancel"></button><button type="button" id="n-go" class="pri" data-t="newGo"></button></div>
    </div>
    <div id="examples" class="card" hidden>
      <h2 data-t="examples"></h2>
      <p class="hint" data-t="examplesLead"></p>
      <ul id="examples-list"></ul>
    </div>
    <div id="recent" class="card" hidden>
      <h2 data-t="recent"></h2>
      <ul id="recent-list"></ul>
    </div>
    <p id="save-note" class="note" hidden data-t="saveNote"></p>
    <p class="note theme-row"><button type="button" id="w-themes" class="ghost" data-t="themeFolderItem"></button> <span id="w-themes-state"></span></p>
    <p class="note" data-t="privacy"></p>
  </section>

  <section id="deck" hidden>
    <!-- スライド一覧（app/slides-panel.js）：信頼する一覧とボタン。縮図はデッキが描く sandbox の枠（一覧の後ろ） -->
    <button type="button" id="b-slides" class="rail" aria-expanded="false" aria-controls="slides"><span data-t="slidesBtn"></span></button>
    <aside id="slides" aria-labelledby="sl-title" hidden></aside>
    <div id="viewer">
      <!-- allow="autoplay"：発表者ビュー（別の窓）で自動再生を始めても、プレビューの音声が鳴るように（キーを押したのはその窓で、この枠ではない。
           音声を鳴らすのはプレビューだけで、発表者ビューは位置と操作を送るだけ） -->
      <iframe id="preview" title="slides" sandbox="allow-scripts allow-modals" allow="autoplay"></iframe>
      <div id="errbox" hidden><div class="errcard"><h2 data-t="buildFailed"></h2><p data-t="buildFailedHint"></p><pre id="errtext"></pre></div></div>
      <div id="loading" data-t="building"></div>
    </div>
    <aside id="panel" hidden>
      <div class="panel-head"><b id="panel-title"></b><span class="sp"></span><button type="button" id="panel-close" class="ghost" aria-label="close">✕</button></div>
      <div id="panel-body"></div>
    </aside>
  </section>
</main>
<footer id="status"><!-- 今どこに保存されているか（作業フォルダ・1 ファイル・まだ保存していない）。main.js の updateSaveLoc --><span id="saveloc" class="saveloc" hidden></span><span id="st-msg"></span><span class="sp"></span><span id="st-info"></span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<!-- 約 1 秒を超える待ちにだけ出す（app/wait-logo.js：assets/logo/egatari-draw-*.svg） -->
<div id="wait" hidden><div class="wait-art"></div><div class="wait-text" data-t="waiting"></div></div>
<div id="wait-badge" aria-hidden="true"></div>
<dialog id="dlg" aria-labelledby="dlg-title"><h2 id="dlg-title"></h2><div id="dlg-body"></div><div class="row" id="dlg-buttons"></div></dialog>
<!--APP_JS-->
</body>
</html>
