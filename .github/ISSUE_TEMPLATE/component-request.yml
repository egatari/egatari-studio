name: Component request
description: "Ask for a new animated figure / 新しい動く図の部品を頼む"
title: "[component request] "
labels: ["component-request", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [components/CATALOG.md](https://github.com/egatari/egatari-studio/blob/main/components/CATALOG.md) first — an existing component with a new attribute may be enough.
        まず [部品の一覧](https://github.com/egatari/egatari-studio/blob/main/components/CATALOG.md) を見てください。既存の部品に属性を足すだけで済むこともあります。
  - type: textarea
    id: animate
    attributes:
      label: What should it animate?
      description: "何を動かして見せたいか（例：観測を足すと事後分布が狭まる）"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Paper / figure context
      description: "どの論文・どの図・どの説明の場面で使うか。公開されている論文ならリンクを"
  - type: textarea
    id: sketch
    attributes:
      label: Sketch or link
      description: "手描きのスケッチ、似た図へのリンクなど（画像を貼れます）"
  - type: textarea
    id: steps
    attributes:
      label: Desired steps
      description: "段階ごとに何が出る・動くか（1 段階 = 説明の 1 区切り）"
      placeholder: |
        0: axes only
        1: first curve draws
        2: second curve, first one turns gray
  - type: input
    id: version
    attributes:
      label: Version
      description: "版（任意）"
