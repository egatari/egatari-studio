<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-predict の見本</title>
<!-- 組み方：node kit/build.mjs components/predict/demo.html -o components/predict/out/demo.html（人数はすべて架空の例） -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>予想してみよう：落ちる速さ</h2>
  <div class="body">
    <p class="ia-badge" style="margin:0 0 10px;line-height:1.3"><span style="display:inline-block;font-size:27px;font-weight:700;color:var(--fg);border:2px dashed var(--accent2);border-radius:8px;padding:0 12px">操作できる</span></p>
    <m-predict unit="人" style="height:400px">
      <script type="application/json">{
        "question": "同じ高さから落とすと、重い球と軽い球のどちらが先に着く？",
        "choices": [{"label": "重い球"}, {"label": "軽い球"}, {"label": "同時"}],
        "answer": 2,
        "counts": [17, 2, 11],
        "note": "空気の抵抗が小さければ、重さによらず同時に着く（ガリレオ）"
      }</script>
    </m-predict>
  </div>
  <div class="concl"><span>→ 落ちる速さは重さで決まらない（人数は架空の例）</span></div>
</section>

<section class="slide">
  <h2>予想してみよう：小数のかけ算</h2>
  <div class="body">
    <m-predict unit="人" poll="p1" style="height:450px">
      <script type="application/json">{
        "question": "0.1 × 0.1 はいくつ？",
        "choices": [{"label": "0.1"}, {"label": "0.01"}, {"label": "0.2"}, {"label": "1"}],
        "answer": 1,
        "counts": [12, 10, 6, 2],
        "note": "0.1 は 10 分の 1。10 分の 1 の 10 分の 1 は 100 分の 1"
      }</script>
    </m-predict>
  </div>
  <div class="concl"><span>→ 1 より小さい数をかけると、もとの数より小さくなる（人数は架空の例）</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:190px 1fr;gap:20px 16px;align-items:center;font-size:27px">
      <div>フェード<br>（fade）</div>
      <m-predict variant="fade" unit="人" style="height:220px">
        <script type="application/json">{"choices": [{"label": "A"}, {"label": "B"}], "answer": 0, "counts": [8, 5]}</script>
      </m-predict>
      <div>線を引く<br>（draw）</div>
      <m-predict variant="draw" unit="人" style="height:220px">
        <script type="application/json">{"choices": [{"label": "A"}, {"label": "B"}], "answer": 0, "counts": [8, 5]}</script>
      </m-predict>
    </div>
  </div>
  <div class="concl"><span>→ 資料のシード値（data-egatari-seed）で 1 つが選ばれる。人数は架空</span></div>
</section>

</div>
</body>
</html>
