<!DOCTYPE html>
<html lang="ja" data-theme="kokugo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-kakijun の見本</title>
<!-- 組み方：node kit/build.mjs components/kakijun/demo.html -o components/kakijun/out/demo.html -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>ひらがなの書き順：あさ</h2>
  <div class="body">
    <m-kakijun text="あさ" ends="on" style="height:400px"></m-kakijun>
  </div>
  <div class="concl"><span>→ 「あ」の 3 画目は、結びを作ってから右へはらう</span></div>
</section>

<section class="slide">
  <h2>濁点のあるカタカナ：ガム</h2>
  <div class="body">
    <m-kakijun text="ガム" style="height:400px"></m-kakijun>
  </div>
  <div class="concl"><span>→ 濁点は、字を書き終えてから左上から右下へ 2 つ</span></div>
</section>

<section class="slide">
  <h2>縦書きの小さい字：きょう</h2>
  <div class="body">
    <m-kakijun text="きょう" writing="tate" size="140" nums="off" style="height:440px"></m-kakijun>
  </div>
  <div class="concl"><span>→ 縦書きの「ょ」は、ます目の右上に小さく書く</span></div>
</section>

</div>
</body>
</html>
