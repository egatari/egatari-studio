<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 読み込めるのはアプリ自身だけ。デッキ（sandbox の iframe）もこの決まりを受け継ぎ、外へは繋がらない。frame-src 'none'：プレビューは srcdoc だけで、
     デッキが自分の iframe をアプリの origin（の URL に何かを載せて）や data: に移すことも止める。
     'unsafe-eval' は部品（m-sweep の f="…" など）が式を new Function で作るため。worker-src blob: は持ち運べる 1 ファイルを読む Worker（アプリに同梱） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Egatari Studio</title>
<link rel="icon" href="data:,">
<!--APP_CSS-->
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true">▶</span><span data-t="brand"></span></div>
  <div id="deckname" class="deckname"></div>
  <nav id="tools" hidden>
    <div class="menu">
      <button type="button" id="b-openmenu" aria-haspopup="menu" aria-expanded="false" aria-controls="m-open" data-t="openMenu"></button>
      <div id="m-open" class="menu-list" role="menu" hidden>
        <button type="button" id="b-open" role="menuitem" data-t="openFolderItem"></button>
        <button type="button" id="b-openfile" role="menuitem" data-t="openFile"></button>
      </div>
    </div>
    <div class="menu split only-portable" hidden>
      <button type="button" id="b-save" data-t="save"></button>
      <button type="button" id="b-savemenu" class="split-arrow" aria-haspopup="menu" aria-expanded="false" aria-controls="m-save" data-t-label="saveMore">▾</button>
      <div id="m-save" class="menu-list" role="menu" hidden>
        <button type="button" id="b-savenew" role="menuitem" data-t="saveNew"></button>
        <button type="button" id="b-saveas" role="menuitem" data-t="saveAs"></button>
      </div>
    </div>
    <span class="sep"></span>
    <button type="button" id="b-edit" data-t="edit" data-key="e"></button>
    <button type="button" id="b-narr" data-t="narr" data-key="n"></button>
    <button type="button" id="b-comments" data-t="comments" data-key="c"></button>
    <button type="button" id="b-audio" data-t="audio"></button>
    <span class="sep"></span>
    <button type="button" id="b-check" data-t="check"></button>
    <div class="menu">
      <button type="button" id="b-exportmenu" aria-haspopup="menu" aria-expanded="false" aria-controls="m-export" data-t="exportMenu"></button>
      <div id="m-export" class="menu-list" role="menu" hidden>
        <button type="button" id="b-unpack" class="only-portable" role="menuitem" data-t="exportFolder" hidden></button>
        <button type="button" id="b-export" class="only-folder" role="menuitem" data-t="export"></button>
        <button type="button" id="b-export-portable" class="only-folder" role="menuitem" data-t="exportPortable"></button>
        <button type="button" id="b-print" role="menuitem" data-t="print"></button>
      </div>
    </div>
    <button type="button" id="b-presenter" data-t="presenter"></button>
    <button type="button" id="b-full" data-t="full"></button>
    <span class="sep"></span>
    <button type="button" id="b-warn" class="warn" hidden></button>
    <button type="button" id="b-help" data-t="helpBtn"></button>
  </nav>
  <button type="button" id="b-lang" class="ghost lang" lang="en" title="English / 日本語"></button>
</header>

<div id="notice" role="alert" hidden></div>
<main>
  <section id="welcome">
    <div class="intro">
      <h1 data-t="welcomeTitle"></h1>
      <p data-t="welcomeLead"></p>
    </div>
    <div id="unsupported" class="note bad" hidden data-t="unsupported"></div>
    <div id="drop" class="drop" tabindex="0">
      <div class="drop-icon" aria-hidden="true">📁</div>
      <div data-t="dropHere"></div>
      <div class="row">
        <button type="button" id="w-open" class="pri" data-t="openFolder"></button>
        <button type="button" id="w-openfile" data-t="openFile"></button>
        <button type="button" id="w-new" data-t="newDeck"></button>
      </div>
    </div>
    <div id="newform" class="card" hidden>
      <h2 data-t="newDeck"></h2>
      <label><span data-t="newTitle"></span><input id="n-title" type="text"></label>
      <label><span data-t="newLang"></span><select id="n-lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
      <label><span data-t="newTheme"></span><select id="n-theme"></select></label>
      <p class="hint" data-t="newHint"></p>
      <div class="row"><button type="button" id="n-cancel" data-t="cancel"></button><button type="button" id="n-go" class="pri" data-t="newGo"></button></div>
    </div>
    <div id="recent" class="card" hidden>
      <h2 data-t="recent"></h2>
      <ul id="recent-list"></ul>
    </div>
    <p class="note" data-t="privacy"></p>
  </section>

  <section id="deck" hidden>
    <div id="viewer">
      <iframe id="preview" title="slides" sandbox="allow-scripts allow-modals"></iframe>
      <div id="errbox" hidden><div class="errcard"><h2 data-t="buildFailed"></h2><p data-t="buildFailedHint"></p><pre id="errtext"></pre></div></div>
      <div id="loading" data-t="building"></div>
    </div>
    <aside id="panel" hidden>
      <div class="panel-head"><b id="panel-title"></b><span class="sp"></span><button type="button" id="panel-close" class="ghost" aria-label="close">✕</button></div>
      <div id="panel-body"></div>
    </aside>
  </section>
</main>
<footer id="status"><span id="st-msg"></span><span class="sp"></span><span id="st-info"></span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-title"><h2 id="dlg-title"></h2><div id="dlg-body"></div><div class="row" id="dlg-buttons"></div></dialog>
<!--APP_JS-->
</body>
</html>
