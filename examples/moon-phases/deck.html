<!DOCTYPE html>
<html lang="ja" data-theme="asagi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月の満ち欠け</title>
<style>
  .mp-svg text { font-size: 26px; }
  .mp-svg .big { font-size: 30px; }
  /* 光と影は m-orbit と同じ色（光＝accent2 を地に 22 %、影＝字の色を地に 42 %）。赤（emph）は「見える所」の印で、光の色ではない */
  .mp-lit { fill: color-mix(in srgb, var(--accent2) 22%, var(--bg)); }
  .mp-dark { fill: color-mix(in srgb, var(--fg) 42%, var(--bg)); }
</style>
</head>
<body>
<div id="stage">

<section class="slide cover noconcl static" id="s-d43eo7">
  <div class="venue">理科（中学 3 年）・地球と宇宙</div>
  <h1>月の満ち欠け</h1>
  <div class="au">見える形は、2 つの半分の重なりで決まる</div>
</section>

<section class="slide" id="s-l6clsi">
  <h2>予想：夕方の西の空の月は？</h2>
  <div class="body">
    <m-predict style="height:380px" unit="人" aria-label="夕方、西の空に見える月はどんな形かを予想する。正解は右側が光る細い月">
      <script type="application/json">{"question": "日がしずんだすぐあと、西の空の低い所に見える月は？", "choices": [{"label": "右側が光る細い月"}, {"label": "左側が光る細い月"}, {"label": "半月"}, {"label": "満月"}], "answer": 0, "counts": [11, 9, 6, 4], "note": "人数は架空"}</script>
    </m-predict>
  </div>
  <div class="concl"><span>答えの理由を、宇宙の上から確かめる</span></div>
</section>

<section class="slide" id="s-tsl2f2">
  <h2>見える形は、2 つの半分の重なり</h2>
  <div class="body">
    <svg class="mp-svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-label="北極の上から見た地球と月。太陽の光は右から来る。月の右半分が光っている半分、地球の側を向いた半分が見える半分。2 つが重なる細い部分だけが、地球から光って見える。地球から見ると、右側が光る細い三日月になる">
      <!-- step 0: earth, moon (dark), not-to-scale note -->
      <circle cx="190" cy="330" r="36" style="fill:var(--term);fill-opacity:.25;stroke:var(--term);stroke-width:3"/>
      <text x="190" y="404" text-anchor="middle" style="fill:var(--fg)">地球</text>
      <circle class="mp-dark" cx="374" cy="146" r="90"/>
      <circle cx="374" cy="146" r="90" style="fill:none;stroke:var(--fg);stroke-width:3"/>
      <text x="374" y="30" text-anchor="middle" style="fill:var(--fg)">月</text>
      <!-- step 1: sunlight and the lit half -->
      <g data-step="1">
        <line x1="660" y1="96" x2="490" y2="96" style="stroke:var(--accent2);stroke-width:4"/>
        <line x1="660" y1="146" x2="490" y2="146" style="stroke:var(--accent2);stroke-width:4"/>
        <line x1="660" y1="196" x2="490" y2="196" style="stroke:var(--accent2);stroke-width:4"/>
        <path d="M490 84 L472 96 L490 108 Z M490 134 L472 146 L490 158 Z M490 184 L472 196 L490 208 Z" style="fill:var(--accent2)"/>
        <text x="672" y="155" style="fill:var(--fg)">太陽の光</text>
        <path class="mp-lit" d="M374 56 A90 90 0 0 1 374 236 Z"/>
        <text x="500" y="44" style="fill:var(--fg)">光っている半分</text>
      </g>
      <!-- step 2: the half that faces the earth -->
      <g data-step="2">
        <line x1="216" y1="304" x2="310" y2="210" style="stroke:var(--term);stroke-width:3;stroke-dasharray:10 8"/>
        <line x1="310.4" y1="82.4" x2="437.6" y2="209.6" style="stroke:var(--term);stroke-width:3"/>
        <path d="M437.6 209.6 A90 90 0 0 1 310.4 82.4 Z" style="fill:var(--term);fill-opacity:.18"/>
        <text x="30" y="150" style="fill:var(--term)">地球から</text>
        <text x="30" y="184" style="fill:var(--term)">見える半分</text>
      </g>
      <!-- step 3: the overlap -->
      <g data-step="3">
        <path d="M374 146 L437.6 209.6 A90 90 0 0 1 374 236 Z" style="fill:none;stroke:var(--emph);stroke-width:6;stroke-linejoin:round"/>
        <text x="440" y="300" style="fill:var(--emph)">重なり＝光って見える所</text>
      </g>
      <!-- step 4: as seen from the earth -->
      <g data-step="4">
        <line x1="760" y1="20" x2="760" y2="400" style="stroke:var(--line);stroke-width:2"/>
        <text x="980" y="44" text-anchor="middle" style="fill:var(--fg)">地球から見ると</text>
        <circle class="mp-dark" cx="980" cy="190" r="110"/>
        <path class="mp-lit" d="M980 80 A110 110 0 0 1 980 300 A77.8 110 0 0 0 980 80 Z" style="stroke:var(--emph);stroke-width:6;stroke-linejoin:round"/>
        <text x="980" y="350" text-anchor="middle" class="big" style="fill:var(--emph)">右側が光る三日月</text>
      </g>
    </svg>
  </div>
  <div class="concl"><span>見えるのは、光っている所のうち、こちらを向いた所だけ</span></div>
</section>

<section class="slide" id="s-xlorhi">
  <h2>1 周すると、重なりが変わる</h2>
  <div class="body">
    <m-orbit style="height:440px" aria-label="北極の上から見た図と、地球から見た月の形。月が新月から反時計回りに 1 周し、三日月、上弦の月、満月、下弦の月と形が変わる">
      <script type="application/json">{"positions": 8, "notes": [null, "夕方・西の空", null, null, null, null, null, null]}</script>
    </m-orbit>
  </div>
  <div class="concl"><span>月が回ると重なりが変わり、形が変わる</span></div>
</section>

<section class="slide" id="s-nqenml">
  <h2>答え：右側が光る細い月</h2>
  <div class="body">
    <svg class="mp-svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-label="日がしずんだすぐあとの西の空。地平線の近く、太陽がしずんだ側に、右側が光る細い月が見える">
      <rect x="0" y="0" width="1180" height="420" rx="16" style="fill:var(--term);fill-opacity:.12"/>
      <path d="M0 330 H1180 V404 A16 16 0 0 1 1164 420 H16 A16 16 0 0 1 0 404 Z" style="fill:var(--muted);fill-opacity:.35"/>
      <line x1="0" y1="330" x2="1180" y2="330" style="stroke:var(--fg);stroke-width:3"/>
      <text x="1160" y="318" text-anchor="end" style="fill:var(--fg)">地平線</text>
      <text x="160" y="386" text-anchor="middle" style="fill:var(--fg)">南</text>
      <text x="590" y="386" text-anchor="middle" style="fill:var(--fg)">西</text>
      <text x="1020" y="386" text-anchor="middle" style="fill:var(--fg)">北</text>
      <g data-step="1">
        <circle cx="740" cy="378" r="30" style="fill:none;stroke:var(--accent2);stroke-width:3;stroke-dasharray:8 6"/>
        <text x="786" y="388" style="fill:var(--fg)">しずんだ太陽</text>
        <circle class="mp-dark" cx="560" cy="200" r="80"/>
        <path class="mp-lit" d="M560 120 A80 80 0 0 1 560 280 A56.6 80 0 0 0 560 120 Z"/>
        <text x="560" y="90" text-anchor="middle" class="big" style="fill:var(--fg)">右側が光る細い月</text>
      </g>
      <g data-step="2">
        <text x="40" y="60" style="fill:var(--fg)">光る側は、いつも太陽の方を向く</text>
      </g>
    </svg>
  </div>
  <div class="concl"><span>月の形は、太陽と月と地球の並びで決まる</span></div>
</section>

</div>
</body>
</html>
