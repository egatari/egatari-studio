<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-menu の見本</title>
<!-- 組み方：node kit/build.mjs components/menu/demo.html -o components/menu/out/demo.html。札はふつうの <a href="#<スライドの id>"> -->
</head>
<body>
<div id="stage">

<section class="slide noconcl" id="s-menu01">
  <h2>今日の内容</h2>
  <div class="body">
    <p class="ia-badge" style="margin:0 0 10px;line-height:1.3"><span style="display:inline-block;font-size:27px;font-weight:700;color:var(--fg);border:2px dashed var(--accent2);border-radius:8px;padding:0 12px">操作できる</span></p>
    <m-menu per-step="2" aria-label="今日の内容">
      <a href="#s-part01" data-icon="1" data-sub="何を確かめたいか">問い</a>
      <a href="#s-part02" data-icon="2" data-sub="集め方と人数">方法</a>
      <a href="#s-part03" data-icon="3" data-sub="図と数字">結果</a>
      <a href="#s-part03:2" data-icon="4" data-sub="結果の 2 段目から">効果の大きさ</a>
    </m-menu>
  </div>
</section>

<section class="slide" id="s-part01">
  <h2>問い</h2>
  <div class="body">
    <ul>
      <li>短い復習は、次の週の小テストの点を上げるか</li>
      <li>上がるなら、どのくらいか</li>
    </ul>
    <p><a href="#s-menu01">目次へ</a></p>
  </div>
  <div class="concl"><span>確かめたいのは、効果の有無と大きさ</span></div>
</section>

<section class="slide" id="s-part02">
  <h2>方法</h2>
  <div class="body">
    <ul>
      <li>2 つの組（各 30 人）で、片方だけ毎回 5 分の復習</li>
      <li>4 週の小テストの平均を比べる</li>
    </ul>
  </div>
  <div class="concl"><span>違いは復習の有無だけにそろえる</span></div>
</section>

<section class="slide" id="s-part03">
  <h2>結果</h2>
  <div class="body">
    <ul>
      <li>復習した組の平均は 72 点、しなかった組は 66 点</li>
      <li>差は 6 点（数字は見本のための架空のもの）</li>
    </ul>
  </div>
  <div class="concl"><span>短い復習でも、点に差が出た</span></div>
</section>

</div>
</body>
</html>
