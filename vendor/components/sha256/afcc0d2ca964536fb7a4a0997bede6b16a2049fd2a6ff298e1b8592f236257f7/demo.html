<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-curves の見本</title>
<!-- 組み方：node kit/build.mjs components/curves/demo.html -o components/curves/out/demo.html -->
<style>
</style>
</head>
<body>
<script>
// 見本の数値：対数正規の予測分布 LN(0, 0.6^2) の平均・中央値・90% 分位点を計算して、縦線の点列にする
document.addEventListener("DOMContentLoaded", function(){
  var s = 0.6, pdf = function(x){ return Math.exp(-Math.pow(Math.log(x), 2) / (2 * s * s)) / (x * s * Math.sqrt(2 * Math.PI)); };
  var mean = Math.exp(s * s / 2), med = 1, q90 = Math.exp(s * 1.2815516);
  var v = function(x){ return [[x, 0], [x, pdf(x)]]; };
  document.getElementById("pred-data").textContent = JSON.stringify([
    {label: "予測分布 *p*(*y*|*w*)", f: "exp(-pow(log(x),2)/(2*0.36))/(x*0.6*sqrt(2*PI))", xr: [0.02, 4], color: "fg", at: 3, anchor: "start", dy: -30},
    {label: "中央値", pts: v(med), color: "term", anchor: "end", ly: 0.04},
    {label: "平均", pts: v(mean), color: "emph", anchor: "start", ly: 0.04},
    {label: "90% 分位点", pts: v(q90), color: "accent2", dash: true, anchor: "start", dx: -4}
  ]);
});
</script>
<div id="stage">

<section class="slide">
  <h2>予測分布と代表値</h2>
  <div class="body">
    <m-curves xr="[0,4]" yr="[0,0.8]" xt="[0,1,2,3,4]" yt="[0,0.2,0.4,0.6,0.8]" yf="1" xl="需要 *y*" yl="密度" style="height:420px">
      <script type="application/json" id="pred-data">[]</script>
    </m-curves>
  </div>
  <div class="concl"><span>→ 右に裾が長いと，平均は中央値より右に来る</span></div>
</section>

<section class="slide">
  <h2>損失関数の形</h2>
  <div class="body">
    <m-curves xr="[-2,2]" yr="[0,4]" xt="[-2,-1,0,1,2]" yt="[0,1,2,3,4]" xl="誤差 *u* = *y* − *a*" yl="損失" style="height:420px">
      <script type="application/json">[
        {"label": "二乗 *u*^2", "f": "x*x", "at": 1.6, "anchor": "end", "dx": -14},
        {"label": "絶対値 |*u*|", "f": "abs(x)", "at": -2, "anchor": "start", "ly": 1.1},
        {"label": "分位点（*τ* = 0.9）", "f": "x >= 0 ? 0.9*x : -0.1*x", "at": -2, "anchor": "start", "dy": -6}
      ]</script>
    </m-curves>
  </div>
  <div class="concl"><span>→ どの損失を使うかで，最適な決定 <i>a</i> が変わる</span></div>
</section>

<section class="slide">
  <h2>需要が増えると（架空の例）</h2>
  <div class="body">
    <m-curves xr="[0,10]" yr="[0,12]" xt="[0,2,4,6,8,10]" yt="[0,3,6,9,12]" xl="数量 *Q*" yl="価格 *P*" style="height:420px">
      <script type="application/json">[
        {"label": "需要 D", "f": "10 - x", "tone": "term", "step": 1, "labelAt": 1.5, "anchor": "below"},
        {"label": "供給 S", "f": "2 + x", "tone": "accent2", "step": 1, "labelAt": 8.5, "anchor": "left"},
        {"label": "増えた需要 D′", "f": "13 - x", "tone": "emph", "step": 2, "labelAt": 2, "anchor": "right"},
        {"label": "均衡", "pts": [[4, 0], [4, 6]], "tone": "muted", "dash": true, "step": 3, "anchor": "left", "ly": 1},
        {"label": "新しい均衡", "pts": [[5.5, 0], [5.5, 7.5]], "tone": "emph", "dash": true, "step": 3, "anchor": "right", "ly": 1}
      ]</script>
    </m-curves>
  </div>
  <div class="concl"><span>→ 需要が増えると，価格も取引量も上がる</span></div>
</section>

</div>
</body>
</html>
