# Editor app (app/) on GitHub Pages: builds dist with tools/build-app.mjs and deploys it.
#   /             the hosted editor (loads only the font files a deck needs)
#   /editor.html  the single-file editor (all fonts embedded, ~10 MB)
#   /lab/         test pages copied as-is from lab/ (lab/irodori.html: Irodori-TTS in the browser on WebGPU)
#   /editor/      redirects to / keeping ?query and #hash (the editor used to live here)
# All paths are relative: the site works at the custom domain https://editor.egatari.org/ (whole site)
# and at https://egatari.github.io/egatari-studio/.
# Only main deploys. "Run workflow" on another branch builds and uploads the artifact without deploying it.
# DRAFT: this only works once Pages is enabled for the repository:
#   1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#   2. Settings -> Secrets and variables -> Actions -> Variables: EDITOR_PAGES = true
# Until EDITOR_PAGES is true, pushes skip the job (so the workflow does not fail); "Run workflow" always runs it.
# See docs/editor.md#publishing-on-github-pages
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lab/**'
      - 'kit/**'
      - 'components/**'
      - 'themes/**'
      - 'server/hints.js'
      - 'server/editor-ui.js'
      - 'tools/build-app.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.EDITOR_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the editor
        run: node tools/build-app.mjs --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
