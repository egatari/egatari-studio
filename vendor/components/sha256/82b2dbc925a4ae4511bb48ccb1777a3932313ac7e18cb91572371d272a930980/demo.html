<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-venn の見本</title>
<!-- 組み方：node kit/build.mjs components/venn/demo.html -o components/venn/out/demo.html（スキルの重なりは架空） -->
<style>
.vlabel{font-size:27px;color:var(--muted);margin:0 0 6px}
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>哺乳類と海の生き物</h2>
  <div class="body">
    <m-venn style="height:420px">
      <script type="application/json">{
        "sets": [{"label": "哺乳類"}, {"label": "海の生き物"}],
        "regions": {
          "A": ["ライオン", "ウマ", "コウモリ"],
          "B": ["マグロ", "タコ", "サンゴ"],
          "AB": ["クジラ", "イルカ", "ジュゴン"]
        }
      }</script>
    </m-venn>
  </div>
  <div class="concl"><span>→ クジラもイルカも、海にすむ哺乳類</span></div>
</section>

<section class="slide">
  <h2>3 つのスキルの重なり（架空）</h2>
  <div class="body">
    <m-venn style="height:430px">
      <script type="application/json">{
        "sets": [{"label": "統計"}, {"label": "プログラミング"}, {"label": "現場の知識"}],
        "regions": {
          "AB": "機械学習",
          "AC": "調査",
          "BC": "自動化",
          "ABC": "データ\n活用"
        }
      }</script>
    </m-venn>
  </div>
  <div class="concl"><span>→ 3 つが重なるところで、データが仕事に生きる</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 40px">
      <div><p class="vlabel">fade（既定）</p>
      <m-venn variant="fade" style="height:330px">
        <script type="application/json">{"sets": [{"label": "朝型"}, {"label": "運動部"}], "regions": {"AB": ["早朝練習"]}}</script>
      </m-venn></div>
      <div><p class="vlabel">draw（線を引いてから塗る）</p>
      <m-venn variant="draw" style="height:330px">
        <script type="application/json">{"sets": [{"label": "朝型"}, {"label": "運動部"}], "regions": {"AB": ["早朝練習"]}}</script>
      </m-venn></div>
    </div>
  </div>
  <div class="concl"><span>→ 書かなければ最初の見せ方（fade）になる。例は架空</span></div>
</section>

</div>
</body>
</html>
