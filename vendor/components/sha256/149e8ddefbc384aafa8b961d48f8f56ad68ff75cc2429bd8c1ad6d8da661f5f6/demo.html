<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-bars の見本</title>
<!-- 組み方：node kit/build.mjs components/bars/demo.html -o components/bars/out/demo.html（数値はすべて架空） -->
<style>
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>年ごとの売上（架空）</h2>
  <div class="body">
    <m-bars unit="億円" digits="1" al="売上" style="height:400px">
      <script type="application/json">{
        "groups": [
          {"label": "1 年目", "value": 0.4},
          {"label": "2 年目", "value": 1.1},
          {"label": "3 年目", "value": 2.6},
          {"label": "4 年目", "value": 7.9, "tone": "emph", "step": 4}
        ],
        "scale": [{"step": 4, "max": 9, "at": 0.6}]
      }</script>
    </m-bars>
  </div>
  <div class="concl"><span>→ 4 年目は前の軸に収まらない伸び</span></div>
</section>

<section class="slide">
  <h2>聞き取りで多かった不満（架空）</h2>
  <div class="body">
    <m-bars orient="h" unit="人" per-step="0" ticks="false" style="height:400px">
      <script type="application/json">{
        "groups": [
          {"label": "書く時間が足りない", "value": 23, "tone": "emph"},
          {"label": "数字の転記の誤り", "value": 17},
          {"label": "書式がそろわない", "value": 12},
          {"label": "承認が遅い", "value": 7}
        ]
      }</script>
    </m-bars>
  </div>
  <div class="concl"><span>→ 一番の不満は書く時間</span></div>
</section>

<section class="slide">
  <h2>2 つの系列を並べる（架空）</h2>
  <div class="body">
    <m-bars unit="%" style="height:400px">
      <script type="application/json">{
        "series": [{"label": "導入前"}, {"label": "導入後"}],
        "groups": [
          {"label": "A 部門", "values": [42, 18]},
          {"label": "B 部門", "values": [35, 15]},
          {"label": "C 部門", "values": [51, 20]}
        ]
      }</script>
    </m-bars>
  </div>
  <div class="concl"><span>→ どの部門でも残業の割合が下がった</span></div>
</section>

<section class="slide">
  <h2>売上の内訳を積み上げる（stack。架空）</h2>
  <div class="body">
    <m-bars stack="true" unit="億円" digits="1" al="売上" style="height:420px">
      <script type="application/json">{
        "series": [{"label": "店頭"}, {"label": "通販"}, {"label": "卸"}],
        "groups": [
          {"label": "1 年目", "values": [2.4, 0.6, 1.0]},
          {"label": "2 年目", "values": [2.5, 1.4, 1.1]},
          {"label": "3 年目", "values": [2.3, 2.6, 1.2]},
          {"label": "4 年目", "values": [2.2, 3.9, 1.2], "tone": "emph"}
        ]
      }</script>
    </m-bars>
  </div>
  <div class="concl"><span>→ 伸びたのは通販。店頭はほぼ横ばい</span></div>
</section>

<section class="slide">
  <h2>前の年からの増減と、答えの割合（架空）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
      <m-bars unit="%" digits="1" al="前年比" aria-label="店ごとの売上の前年比（負の値）" style="height:420px">
        <script type="application/json">{
          "groups": [
            {"label": "北店", "value": 4.2},
            {"label": "駅前店", "value": -3.1, "tone": "emph"},
            {"label": "南店", "value": 1.5},
            {"label": "西店", "value": -0.8}
          ]
        }</script>
      </m-bars>
      <m-bars stack="percent" orient="h" per-step="0" ticks="false" aria-label="学年ごとの答えの割合（100 % 積み上げ）" style="height:420px">
        <script type="application/json">{
          "series": [{"label": "はい"}, {"label": "いいえ"}, {"label": "未定"}],
          "groups": [
            {"label": "1 年", "values": [48, 30, 42]},
            {"label": "2 年", "values": [66, 24, 30]},
            {"label": "3 年", "values": [72, 24, 24]}
          ]
        }</script>
      </m-bars>
    </div>
  </div>
  <div class="concl"><span>→ 駅前店だけが大きく減った。学年が上がるほど「はい」が増える</span></div>
</section>

</div>
</body>
</html>
