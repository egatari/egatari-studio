# Irodori-TTS 読み辞書
#
# terms: 読み上げ原稿に出たら必ず仮名へ置換する語。
#   ここに載る条件は「Irodori-TTS が実際に誤読すること」と
#   「仮名化すると正しく読めること」の両方が測定で確認されていること。
#   正しく読める語を載せると、語彙的文脈が減って韻律が落ちるだけなので載せない。
#   長い語から先にマッチするので、対数尤度 は 尤度 より優先される。
#
# watch: 置換しない。原稿に出たら「文脈依存なので確認せよ」と警告するだけ。
#   正解の読みが文ごとに変わる語は、辞書（語に対する固定の対応）では表現できない。
#   モデルは文脈からおおむね正しく読み分けるので、誤ったところだけ原稿側を直す。
#
# 測定: ja-tts-bench/ の検出器で 2026-09-07 に v4.1-Small を計測。
#   70語中18語が誤読、うち18語すべてが仮名化で解消することを確認済み。

terms:
  # 確率・統計
  対数尤度: たいすうゆうど
  尤度: ゆうど
  # 最尤系（2026-09-17 実測：最尤推定 → さいこん と誤読。仮名化で解消）
  # 複合形も登録する。`最尤` だけだと後続の漢字で「より長い語の一部」と見なされ
  # 置換されない（対数尤度 を別に登録しているのと同じ理由）
  # 尤度系の複合語（2026-09-17 実測：尤度関数 → こんどかんすう、
  # 尤度最大化 → こんどさいだいか。いずれも仮名化で解消）
  # 単独の `尤度` を登録しても、後続が漢字だと置換されないため複合語ごとに要る
  尤度最大化: ゆうどさいだいか
  尤度関数: ゆうどかんすう
  最尤推定量: さいゆうすいていりょう
  最尤推定法: さいゆうすいていほう
  最尤推定: さいゆうすいてい
  最尤: さいゆう
  不偏推定量: ふへんすいていりょう
  歪度: わいど
  分位点: ぶんいてん
  棄却: ききゃく

  # 統計的学習理論・機械学習
  決定木: けっていぎ
  閾値: しきいち          # いきち ではなく しきいち で統一

  # 最適化・線形代数
  双対問題: そうついもんだい   # 双対 より先に当てる（複合語は個別に実測して登録する）
  双対: そうつい
  鞍点: あんてん
  冪乗: べきじょう

  # 経営工学・品質管理
  歩留まり: ぶどまり
  抜取検査: ぬきとりけんさ

  # 簿記・会計
  貸借対照表: たいしゃくたいしょうひょう
  借方: かりかた
  引当金: ひきあてきん
  粗利益: あらりえき

  # 人間工学
  筋電図: きんでんず

  # 2026-10-19 の試用（高校生向けの講座の教材、ブラウザの 500M-v3）で誤読を聞いた語
  #   化学：電子殻（L殻・M殻）／国語：送り仮名／理科・美術：濃い側
  L殻: エルかく
  M殻: エムかく
  送り仮名: おくりがな
  濃い側: こいがわ

  # 英数字混じり（既存ガイドの既知の誤読）
  Part 1: パート1
  Part 2: パート2
  Man: マン
  Machine: マシン
  Material: マテリアル
  Money: マネー
  CVP: シーブイピー
  NPV: エヌピーブイ
  PCA: ピーシーエー
  DX: ディーエックス
  AI: エーアイ

# 候補読みのリスト。先頭がこの原稿群での通常の読み（yomi_check.py が期待値に使う）。
watch:
  # 意味クラスで書く。検出したいのは**意味が変わる相違だけ**で、同じ意味の
  # 語形のゆれ（十分 じっぷん/じゅっぷん）は検出しない。
  # クラスの先頭がこの原稿群での既定、クラス内の先頭が第1推奨形（NHK の用語）。
  表:
    - 意味: 図表
      読み: [ひょう]
    - 意味: 表面
      読み: [おもて]
  十分:
    - 意味: 量
      読み: [じゅうぶん]
    - 意味: 時間
      読み: [じゅっぷん, じっぷん]   # 実測で じっぷん は一度も最尤にならない
  一目:
    - 意味: 見ること
      読み: [ひとめ]
    - 意味: 一目置く
      読み: [いちもく]
  大文字:
    - 意味: 文字
      読み: [おおもじ]
    - 意味: 京都の山
      読み: [だいもんじ]
  最中:
    - 意味: 途中
      # さなか は 2026-09-17 の聴取で実際に発話が確認された（菓子の文脈なのに
      # さなか と読まれ、候補に無いため採点器が もなか を選んでいた）
      読み: [さいちゅう, さなか]
    - 意味: 菓子
      読み: [もなか]

# 誤読の原因になった字。これを含む未登録語を警告する（置換はしない）。
#
# 辞書は語単位なので、登録語と漢字を共有する未登録語を取りこぼす。
# `尤度` は登録済みでも `最尤` は素通りし、警告すら出なかった（2026-09-17 に実害）。
# 誤読が起きるのは分野の珍しさではなく**特定の字**である（findings.md §14。
# 因果推論の難読語 交絡・漸近・頑健・反実仮想 は全て正しく読めていた）。
#
# 登録語の構成漢字を機械的に拾うと `貸借対照表` の `対`・`照` まで入って警告だらけに
# なるので、**実測で誤読が確認された字だけ**を人が足す。値は登録の根拠となった語。
watch_kanji:
  尤: [尤度, 対数尤度, 最尤推定]
  歪: [歪度]
  冪: [冪乗]
  鞍: [鞍点]
  凹: []          # 2026-09-17 実測（凹関数 → へこ）。該当する登録語はまだ無い
