<!DOCTYPE html>
<html lang="ja" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m-fishbone の見本</title>
<!-- 組み方：node kit/build.mjs components/fishbone/demo.html -o components/fishbone/out/demo.html（配送の例は架空） -->
<style>
.vcap{font-size:27px;color:var(--muted);text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<div id="stage">

<section class="slide">
  <h2>配送の遅れの原因（架空）</h2>
  <div class="body">
    <m-fishbone aria-label="配送の遅れの特性要因図" style="height:440px">
      <script type="application/json">{
        "effect": {"label": "配送の遅れ", "note": "1 日 12 件"},
        "nodes": [
          {"id": "p", "label": "人"},
          {"id": "p1", "label": "人手が足りない", "parent": "p"},
          {"id": "p11", "label": "繁忙期の採用が遅い", "parent": "p1"},
          {"id": "p2", "label": "道に慣れていない", "parent": "p"},
          {"id": "m", "label": "機械"},
          {"id": "m1", "label": "車の故障が多い", "parent": "m"},
          {"id": "m2", "label": "端末の反応が遅い", "parent": "m"},
          {"id": "h", "label": "方法"},
          {"id": "h1", "label": "積み込みの順が悪い", "parent": "h", "tone": "emph"},
          {"id": "h2", "label": "経路を手で決めている", "parent": "h"},
          {"id": "z", "label": "材料"},
          {"id": "z1", "label": "伝票の記入漏れ", "parent": "z"},
          {"id": "z2", "label": "箱の大きさがばらばら", "parent": "z"}
        ]
      }</script>
    </m-fishbone>
  </div>
  <div class="concl"><span>→ 人・機械・方法・材料（4M）に分けて原因を洗い出す</span></div>
</section>

<section class="slide">
  <h2>植物が育たないのはなぜ（order="effect-first"）</h2>
  <div class="body">
    <m-fishbone order="effect-first" aria-label="植物が育たない原因" style="height:440px">
      <script type="application/json">{
        "effect": {"label": "植物が\n育たない"},
        "nodes": [
          {"id": "l", "label": "光"},
          {"id": "l1", "label": "日当たりが悪い", "parent": "l"},
          {"id": "l2", "label": "光の当たる時間が短い", "parent": "l"},
          {"id": "w", "label": "水"},
          {"id": "w1", "label": "水が足りない", "parent": "w"},
          {"id": "w2", "label": "水のやりすぎ", "parent": "w"},
          {"id": "w21", "label": "根が腐る", "parent": "w2"},
          {"id": "s", "label": "土"},
          {"id": "s1", "label": "肥料が足りない", "parent": "s"},
          {"id": "s2", "label": "水はけが悪い", "parent": "s"},
          {"id": "t", "label": "温度"},
          {"id": "t1", "label": "気温が低い", "parent": "t", "note": "15 ℃ 未満"},
          {"id": "t2", "label": "昼と夜の差が大きい", "parent": "t"}
        ]
      }</script>
    </m-fishbone>
  </div>
  <div class="concl"><span>→ 結果を先に置き、光・水・土・温度の順に原因を足す</span></div>
</section>

<section class="slide">
  <h2>見せ方の種類（variant）</h2>
  <div class="body">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px">
      <div><div class="vcap">箱と字、それから線（fade、既定）</div>
      <m-fishbone variant="fade" aria-label="遅刻の原因（fade）" style="height:340px">
        <script type="application/json">{"effect": {"label": "遅刻"}, "nodes": [{"id": "a", "label": "自分"}, {"id": "a1", "label": "寝坊", "parent": "a"}, {"id": "a2", "label": "準備が遅い", "parent": "a"}, {"id": "b", "label": "交通"}, {"id": "b1", "label": "電車の遅れ", "parent": "b"}, {"id": "b2", "label": "道の混雑", "parent": "b"}]}</script>
      </m-fishbone></div>
      <div><div class="vcap">線を引いてから箱と字（draw）</div>
      <m-fishbone variant="draw" aria-label="遅刻の原因（draw）" style="height:340px">
        <script type="application/json">{"effect": {"label": "遅刻"}, "nodes": [{"id": "a", "label": "自分"}, {"id": "a1", "label": "寝坊", "parent": "a"}, {"id": "a2", "label": "準備が遅い", "parent": "a"}, {"id": "b", "label": "交通"}, {"id": "b1", "label": "電車の遅れ", "parent": "b"}, {"id": "b2", "label": "道の混雑", "parent": "b"}]}</script>
      </m-fishbone></div>
      <div><div class="vcap">背骨の側から伸びる（grow）</div>
      <m-fishbone variant="grow" aria-label="遅刻の原因（grow）" style="height:340px">
        <script type="application/json">{"effect": {"label": "遅刻"}, "nodes": [{"id": "a", "label": "自分"}, {"id": "a1", "label": "寝坊", "parent": "a"}, {"id": "a2", "label": "準備が遅い", "parent": "a"}, {"id": "b", "label": "交通"}, {"id": "b1", "label": "電車の遅れ", "parent": "b"}, {"id": "b2", "label": "道の混雑", "parent": "b"}]}</script>
      </m-fishbone></div>
    </div>
  </div>
  <div class="concl"><span>→ 資料のシード値（data-egatari-seed）で 1 つが選ばれる</span></div>
</section>

</div>
</body>
</html>
